<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Ulang Kata Sandi — RTMBOT Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .ambient-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(13, 148, 136, 0.18) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(80px);
        }
        .ambient-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(80px);
        }

        .card-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 28px;
            padding: 36px 30px;
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            border-radius: 28px 28px 0 0;
            background: linear-gradient(90deg, #14B8A6, #3B82F6);
        }

        .logo-wrap {
            width: 60px;
            height: 60px;
            margin: 0 auto 16px auto;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid rgba(20, 184, 166, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
        }

        .title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 22px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 6px;
            background: linear-gradient(to right, #F8FAFC, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: #94A3B8;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* Identity Badge Box */
        .user-badge {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(20, 184, 166, 0.35);
            border-radius: 16px;
            padding: 14px 16px;
            margin-bottom: 22px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .badge-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            background: rgba(20, 184, 166, 0.15);
            color: #14B8A6;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .badge-info {
            overflow: hidden;
        }

        .badge-label {
            font-size: 11px;
            font-weight: 700;
            color: #14B8A6;
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .badge-email {
            font-size: 14px;
            font-weight: 600;
            color: #F8FAFC;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-uid {
            font-size: 11px;
            color: #64748B;
            font-family: monospace;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            height: 46px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 12px;
            padding: 0 16px;
            color: #F8FAFC;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #14B8A6;
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
        }

        .form-input::placeholder {
            color: #64748B;
        }

        .btn-submit {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            background: linear-gradient(135deg, #0D9488, #0F766E);
            border: 1px solid rgba(20, 184, 166, 0.5);
            border-radius: 12px;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.4);
            background: linear-gradient(135deg, #14B8A6, #0D9488);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 18px;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #FCA5A5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6EE7B7;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #93C5FD;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #64748B;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #14B8A6;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-fx">
        <div class="ambient-1"></div>
        <div class="ambient-2"></div>
    </div>

    <div class="card-container">
        <div class="logo-wrap">🔐</div>
        <h1 class="title">Reset Kata Sandi</h1>
        <p class="subtitle" id="formSubtitle">Sistem Pemulihan Akun Terautentikasi Al-Qur'an &amp; RTMBOT</p>

        <!-- Dynamic User Identity Badge (Shown when authenticated via Email Link) -->
        <div id="userBadge" class="user-badge" style="display: none;">
            <div class="badge-icon">👤</div>
            <div class="badge-info">
                <div class="badge-label">Akun Terautentikasi</div>
                <div class="badge-email" id="badgeEmail">Memuat akun...</div>
                <div class="badge-uid" id="badgeUid">UID: ...</div>
            </div>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form id="resetForm" onsubmit="handleReset(event)">
            <!-- Manual OTP / Email inputs (Shown if user opened web directly without link) -->
            <div id="manualOtpGroup">
                <div class="form-group">
                    <label class="form-label">Email Akun Terdaftar</label>
                    <input type="email" id="inputEmail" class="form-input" placeholder="Masukkan email akun Anda" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Kode OTP 6-Digit (Dari Email)</label>
                    <input type="text" id="inputOtp" class="form-input" placeholder="6 Digit Angka" maxlength="8" required style="letter-spacing: 3px; font-weight: 700;">
                </div>
            </div>

            <!-- New Password inputs -->
            <div class="form-group">
                <label class="form-label">Kata Sandi Baru</label>
                <input type="password" id="inputPassword" class="form-input" placeholder="Minimal 6 karakter" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label">Konfirmasi Kata Sandi Baru</label>
                <input type="password" id="inputConfirmPassword" class="form-input" placeholder="Ulangi kata sandi baru" required minlength="6">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Simpan Kata Sandi Baru</span>
            </button>
        </form>

        <a href="/" class="back-link">← Kembali ke Beranda RTMBOT</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmkiziyyzkeumflrhhpb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBta2l6aXl5emtldW1mbHJoaHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODQ3MjQsImV4cCI6MjA5MjM2MDcyNH0.o_aaf4AwUPS01_7dPnLecNLFiYoJe478oCjNgBTsK4U';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let isRecoveryMode = false;
        let currentUser = null;

        window.addEventListener('DOMContentLoaded', async () => {
            // Check session from link click
            const { data: { session } } = await sb.auth.getSession();
            if (session && session.user) {
                applyAuthenticatedUser(session.user);
            }

            sb.auth.onAuthStateChange(async (event, session) => {
                if (event === 'PASSWORD_RECOVERY' || (session && session.user)) {
                    applyAuthenticatedUser(session.user);
                }
            });

            // If no token in URL
            if (!window.location.hash.includes('access_token') && !window.location.search.includes('code') && !session) {
                showAlert('ℹ️ Anda membuka halaman reset secara langsung. Silakan masukkan email terdaftar dan kode OTP 6-digit yang dikirimkan ke email Anda.', 'info');
                document.getElementById('manualOtpGroup').style.display = 'block';
                document.getElementById('inputEmail').required = true;
                document.getElementById('inputOtp').required = true;
            }
        });

        function applyAuthenticatedUser(user) {
            if (!user) return;
            currentUser = user;
            isRecoveryMode = true;

            // Hide manual email/OTP inputs because user is already authenticated via email token!
            document.getElementById('manualOtpGroup').style.display = 'none';
            document.getElementById('inputEmail').required = false;
            document.getElementById('inputOtp').required = false;

            // Show User Identity Badge
            const userBadge = document.getElementById('userBadge');
            const badgeEmail = document.getElementById('badgeEmail');
            const badgeUid = document.getElementById('badgeUid');

            userBadge.style.display = 'flex';
            badgeEmail.innerText = user.email || 'Akun Pengguna';
            badgeUid.innerText = 'UID: ' + user.id;

            showAlert('✅ Identitas akun terverifikasi (' + user.email + '). Silakan tentukan kata sandi baru Anda di bawah ini.', 'success');
        }

        function showAlert(msg, type = 'error') {
            const el = document.getElementById('alertBox');
            let cls = 'alert-error';
            if (type === 'success') cls = 'alert-success';
            if (type === 'info') cls = 'alert-info';

            el.className = 'alert-box ' + cls;
            el.innerHTML = msg;
            el.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        async function handleReset(e) {
            e.preventDefault();
            hideAlert();

            const password = document.getElementById('inputPassword').value.trim();
            const confirmPass = document.getElementById('inputConfirmPassword').value.trim();

            if (password !== confirmPass) {
                showAlert('Konfirmasi kata sandi tidak cocok!');
                return;
            }

            if (password.length < 6) {
                showAlert('Kata sandi minimal 6 karakter!');
                return;
            }

            const btn = document.getElementById('btnSubmit');
            const spinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'Menyimpan Kata Sandi...';

            try {
                if (!isRecoveryMode) {
                    const email = document.getElementById('inputEmail').value.trim();
                    const token = document.getElementById('inputOtp').value.trim();

                    // Step 1: Verify OTP & Email
                    const { data: verifyData, error: verifyError } = await sb.auth.verifyOtp({
                        email: email,
                        token: token,
                        type: 'recovery'
                    });

                    if (verifyError) {
                        throw new Error(verifyError.message || 'Kode OTP tidak valid atau telah kadaluarsa.');
                    }
                }

                // Step 2: Update User Password
                const { data, error } = await sb.auth.updateUser({
                    password: password
                });

                if (error) {
                    throw error;
                }

                showAlert('🎉 Alhamdulillah! Kata sandi akun Anda berhasil diperbarui. Silakan buka aplikasi Al-Qur'an dan masuk dengan kata sandi baru Anda.', 'success');
                document.getElementById('resetForm').style.display = 'none';

            } catch (err) {
                showAlert('⚠️ ' + (err.message || 'Gagal mengubah kata sandi.'));
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'Simpan Kata Sandi Baru';
            }
        }
    </script>
</body>
</html>
