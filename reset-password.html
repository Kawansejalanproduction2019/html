<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atur Ulang Kata Sandi: RTMBOT &amp; Al-Quran</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="rtm-design-system.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    (function() {
      const saved = localStorage.getItem('rtm_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
    }

    .auth-card {
      background: var(--rtm-surface);
      border: 1px solid var(--rtm-border);
      border-radius: var(--radius-lg);
      padding: 38px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: var(--rtm-shadow-md);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .auth-header {
      text-align: center;
    }

    .auth-brand-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--rtm-primary-light);
      background: rgba(13, 148, 136, 0.12);
      border: 1px solid rgba(20, 184, 166, 0.25);
      padding: 3px 10px;
      border-radius: var(--radius-pill);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .auth-sub {
      font-size: 0.88rem;
      color: var(--rtm-text-secondary);
      line-height: 1.5;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--rtm-text-main);
    }

    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      background: var(--rtm-surface-elevated);
      border: 1px solid var(--rtm-border);
      color: var(--rtm-text-main);
      font-family: var(--font-body);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--rtm-primary-light);
    }

    .btn-submit {
      width: 100%;
      min-height: var(--tap-target-min);
      background: var(--rtm-primary);
      color: #FFFFFF;
      border: 1px solid var(--rtm-primary-hover);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    .btn-submit:hover {
      background: var(--rtm-primary-hover);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert-box {
      display: none;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .alert-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #F87171;
    }

    .alert-success {
      background: rgba(13, 148, 136, 0.12);
      border: 1px solid rgba(20, 184, 166, 0.3);
      color: var(--rtm-primary-light);
    }

    .alert-info {
      background: rgba(59, 130, 246, 0.12);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60A5FA;
    }

    .user-badge {
      display: none;
      flex-direction: column;
      background: var(--rtm-surface-elevated);
      border: 1px solid var(--rtm-border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      font-size: 0.8rem;
    }

    .badge-email {
      font-weight: 700;
      color: var(--rtm-text-main);
    }

    .badge-uid {
      color: var(--rtm-text-muted);
      font-family: var(--font-mono);
      font-size: 0.72rem;
    }

    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .back-home-link {
      text-align: center;
      font-size: 0.85rem;
      color: var(--rtm-text-secondary);
      text-decoration: none;
    }

    .back-home-link:hover {
      color: var(--rtm-primary-light);
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span class="auth-brand-badge">Keamanan Akun</span>
        <h1 class="auth-title">Atur Ulang Kata Sandi</h1>
        <p class="auth-sub">Masukkan kata sandi baru untuk akun aplikasi Al-Quran &amp; RTMBOT Anda.</p>
      </div>

      <div id="userBadge" class="user-badge">
        <span id="badgeEmail" class="badge-email"></span>
        <span id="badgeUid" class="badge-uid"></span>
      </div>

      <div id="alertBox" class="alert-box"></div>

      <form id="resetForm" onsubmit="handleReset(event)">
        <div class="form-group">
          <label for="inputPassword" class="form-label">Kata Sandi Baru</label>
          <input type="password" id="inputPassword" class="form-input" placeholder="Minimal 6 karakter" required minlength="6">
        </div>

        <div class="form-group">
          <label for="inputConfirmPassword" class="form-label">Konfirmasi Kata Sandi</label>
          <input type="password" id="inputConfirmPassword" class="form-input" placeholder="Ulangi kata sandi baru" required minlength="6">
        </div>

        <button type="submit" id="btnSubmit" class="btn-submit">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Simpan Kata Sandi Baru</span>
        </button>
      </form>

      <a href="/" class="back-home-link">Kembali ke Beranda Hub</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = 'https://pmkiziyyzkeumflrhhpb.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBta2l6aXl5emtldW1mbHJoaHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODQ3MjQsImV4cCI6MjA5MjM2MDcyNH0.o_aaf4AwUPS01_7dPnLecNLFiYoJe478oCjNgBTsK4U';
    
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.addEventListener('DOMContentLoaded', async () => {
      const search = window.location.search;
      const hash = window.location.hash;
      const urlParams = new URLSearchParams(search);

      const tokenHash = urlParams.get('token_hash');
      const type = urlParams.get('type') || 'recovery';

      if (tokenHash) {
        try {
          const { data, error } = await sb.auth.verifyOtp({
            token_hash: tokenHash,
            type: type
          });
          if (!error && data && data.user) {
            applyAuthenticatedUser(data.user);
            return;
          }
        } catch (e) {}
      }

      if (hash.includes('access_token')) {
        const hashParams = new URLSearchParams(hash.substring(1));
        const accessToken = hashParams.get('access_token');
        const refreshToken = hashParams.get('refresh_token') || '';
        
        try {
          const { data, error } = await sb.auth.setSession({
            access_token: accessToken,
            refresh_token: refreshToken
          });
          if (!error && data && data.user) {
            applyAuthenticatedUser(data.user);
            return;
          }
        } catch (e) {}
      }

      const { data: { session } } = await sb.auth.getSession();
      if (session && session.user) {
        applyAuthenticatedUser(session.user);
        return;
      }

      showAlert('Silakan masukkan kata sandi baru Anda di formulir.', 'info');
    });

    function applyAuthenticatedUser(user) {
      if (!user) return;
      const userBadge = document.getElementById('userBadge');
      const badgeEmail = document.getElementById('badgeEmail');
      const badgeUid = document.getElementById('badgeUid');

      userBadge.style.display = 'flex';
      badgeEmail.textContent = user.email || 'Akun Pengguna';
      badgeUid.textContent = 'UID: ' + user.id;

      showAlert('Akun terverifikasi (' + user.email + '). Silakan masukkan kata sandi baru.', 'success');
    }

    function showAlert(msg, type = 'error') {
      const el = document.getElementById('alertBox');
      let cls = 'alert-error';
      if (type === 'success') cls = 'alert-success';
      if (type === 'info') cls = 'alert-info';
      el.className = 'alert-box ' + cls;
      el.textContent = msg;
      el.style.display = 'block';
    }

    async function handleReset(e) {
      e.preventDefault();
      document.getElementById('alertBox').style.display = 'none';

      const password = document.getElementById('inputPassword').value.trim();
      const confirmPass = document.getElementById('inputConfirmPassword').value.trim();

      if (password !== confirmPass) {
        showAlert('Konfirmasi kata sandi tidak cocok!');
        return;
      }
      if (password.length < 6) {
        showAlert('Kata sandi minimal 6 karakter!');
        return;
      }

      const btn = document.getElementById('btnSubmit');
      const spinner = document.getElementById('btnSpinner');
      const btnText = document.getElementById('btnText');

      btn.disabled = true;
      spinner.style.display = 'inline-block';
      btnText.textContent = 'Menyimpan Kata Sandi...';

      try {
        const { data, error } = await sb.auth.updateUser({
          password: password
        });

        if (error) throw error;

        // Invalidate session to avoid token re-use
        await sb.auth.signOut();
        window.history.replaceState({}, document.title, window.location.pathname);

        showAlert('Alhamdulillah, kata sandi akun Anda berhasil diperbarui. Silakan kembali ke aplikasi dan masuk dengan kata sandi baru Anda.', 'success');
        document.getElementById('resetForm').style.display = 'none';
        document.getElementById('userBadge').style.display = 'none';

      } catch (err) {
        showAlert('Galat: ' + (err.message || 'Gagal mengubah kata sandi. Pastikan tautan belum kadaluarsa.'));
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Simpan Kata Sandi Baru';
      }
    }
  </script>
</body>
</html>
