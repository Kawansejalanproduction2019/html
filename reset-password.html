<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atur Ulang Kata Sandi — RTMBOT Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .bg-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .ambient-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(13, 148, 136, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(80px);
        }
        .ambient-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.12) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(80px);
        }

        .card-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 28px;
            padding: 40px 32px;
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            border-radius: 28px 28px 0 0;
            background: linear-gradient(90deg, #14B8A6, #3B82F6);
        }

        .logo-wrap {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px auto;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(20, 184, 166, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid rgba(20, 184, 166, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
        }

        .title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 24px;
            font-weight: 800;
            text-align: center;
            margin-bottom: 8px;
            background: linear-gradient(to right, #F8FAFC, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: #94A3B8;
            text-align: center;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #94A3B8;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            height: 48px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 14px;
            padding: 0 16px;
            color: #F8FAFC;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            border-color: #14B8A6;
            background: rgba(30, 41, 59, 0.8);
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
        }

        .form-input::placeholder {
            color: #64748B;
        }

        .btn-submit {
            width: 100%;
            height: 50px;
            margin-top: 10px;
            background: linear-gradient(135deg, #0D9488, #0F766E);
            border: 1px solid rgba(20, 184, 166, 0.5);
            border-radius: 14px;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.4);
            background: linear-gradient(135deg, #14B8A6, #0D9488);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .alert-box {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #FCA5A5;
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #6EE7B7;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: #64748B;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #14B8A6;
        }

        .tab-mode {
            display: flex;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 24px;
            border: 1px solid rgba(51, 65, 85, 0.6);
        }

        .tab-btn {
            flex: 1;
            padding: 8px;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: #94A3B8;
            background: transparent;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: #0D9488;
            color: #FFFFFF;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: #FFFFFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="bg-fx">
        <div class="ambient-1"></div>
        <div class="ambient-2"></div>
    </div>

    <div class="card-container">
        <div class="logo-wrap">🔐</div>
        <h1 class="title">Reset Kata Sandi</h1>
        <p class="subtitle" id="formSubtitle">Masukkan kata sandi baru untuk akun Al-Qur'an & RTMBOT Anda</p>

        <div id="alertBox" class="alert-box"></div>

        <!-- MODE SELECTION TABS -->
        <div class="tab-mode" id="tabContainer" style="display: none;">
            <button class="tab-btn active" id="tabLinkMode" onclick="switchTab('link')">Tautan Email</button>
            <button class="tab-btn" id="tabOtpMode" onclick="switchTab('otp')">Kode OTP 6-Digit</button>
        </div>

        <form id="resetForm" onsubmit="handleReset(event)">
            <!-- OTP Mode extra fields -->
            <div id="otpFields" style="display: none;">
                <div class="form-group">
                    <label class="form-label">Email Terdaftar</label>
                    <input type="email" id="inputEmail" class="form-input" placeholder="nama@email.com">
                </div>
                <div class="form-group">
                    <label class="form-label">Kode Verifikasi OTP (6 Digit)</label>
                    <input type="text" id="inputOtp" class="form-input" placeholder="Misal: 489201" maxlength="8">
                </div>
            </div>

            <!-- Password fields -->
            <div class="form-group">
                <label class="form-label">Kata Sandi Baru</label>
                <input type="password" id="inputPassword" class="form-input" placeholder="Minimal 6 karakter" required minlength="6">
            </div>

            <div class="form-group">
                <label class="form-label">Konfirmasi Kata Sandi Baru</label>
                <input type="password" id="inputConfirmPassword" class="form-input" placeholder="Ulangi kata sandi baru" required minlength="6">
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">
                <span class="spinner" id="btnSpinner"></span>
                <span id="btnText">Simpan Kata Sandi Baru</span>
            </button>
        </form>

        <a href="/" class="back-link">← Kembali ke Halaman Utama</a>
    </div>

    <script>
        const SUPABASE_URL = 'https://pmkiziyyzkeumflrhhpb.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBta2l6aXl5emtldW1mbHJoaHBiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODQ3MjQsImV4cCI6MjA5MjM2MDcyNH0.o_aaf4AwUPS01_7dPnLecNLFiYoJe478oCjNgBTsK4U';
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentMode = 'link';
        let isSessionAuthenticated = false;

        // Check URL Hash or Query params
        window.addEventListener('DOMContentLoaded', async () => {
            const hash = window.location.hash;
            const searchParams = new URLSearchParams(window.location.search);

            // Handle Supabase Auth Session
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                isSessionAuthenticated = true;
            }

            sb.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY' || session) {
                    isSessionAuthenticated = true;
                }
            });

            if (!hash.includes('access_token') && !searchParams.get('code') && !isSessionAuthenticated) {
                // If opened directly without hash link, show OTP mode tab
                document.getElementById('tabContainer').style.display = 'flex';
                switchTab('otp');
            }
        });

        function switchTab(mode) {
            currentMode = mode;
            const tabLink = document.getElementById('tabLinkMode');
            const tabOtp = document.getElementById('tabOtpMode');
            const otpFields = document.getElementById('otpFields');

            if (mode === 'otp') {
                tabOtp.classList.add('active');
                tabLink.classList.remove('active');
                otpFields.style.display = 'block';
                document.getElementById('inputEmail').required = true;
                document.getElementById('inputOtp').required = true;
            } else {
                tabLink.classList.add('active');
                tabOtp.classList.remove('active');
                otpFields.style.display = 'none';
                document.getElementById('inputEmail').required = false;
                document.getElementById('inputOtp').required = false;
            }
        }

        function showAlert(msg, isError = true) {
            const el = document.getElementById('alertBox');
            el.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-success');
            el.innerHTML = msg;
            el.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alertBox').style.display = 'none';
        }

        async function handleReset(e) {
            e.preventDefault();
            hideAlert();

            const password = document.getElementById('inputPassword').value.trim();
            const confirmPass = document.getElementById('inputConfirmPassword').value.trim();

            if (password !== confirmPass) {
                showAlert('Konfirmasi kata sandi tidak cocok!');
                return;
            }

            if (password.length < 6) {
                showAlert('Kata sandi minimal 6 karakter!');
                return;
            }

            const btn = document.getElementById('btnSubmit');
            const spinner = document.getElementById('btnSpinner');
            const btnText = document.getElementById('btnText');

            btn.disabled = true;
            spinner.style.display = 'block';
            btnText.innerText = 'Memproses...';

            try {
                if (currentMode === 'otp') {
                    const email = document.getElementById('inputEmail').value.trim();
                    const token = document.getElementById('inputOtp').value.trim();

                    // Step 1: Verify OTP
                    const { data: verifyData, error: verifyError } = await sb.auth.verifyOtp({
                        email: email,
                        token: token,
                        type: 'recovery'
                    });

                    if (verifyError) {
                        throw new Error(verifyError.message || 'Kode OTP tidak valid atau kadaluarsa.');
                    }
                }

                // Step 2: Update Password
                const { data, error } = await sb.auth.updateUser({
                    password: password
                });

                if (error) {
                    throw error;
                }

                showAlert('✅ Alhamdulillah! Kata sandi Anda berhasil diperbarui. Silakan buka aplikasi Al-Qur'an dan masuk dengan kata sandi baru Anda.', false);
                document.getElementById('resetForm').style.display = 'none';

            } catch (err) {
                let msg = err.message || 'Gagal mengubah kata sandi.';
                if (msg.includes('Auth session missing')) {
                    msg = 'Sesi tautan telah kadaluarsa atau tidak valid. Silakan gunakan tab "Kode OTP 6-Digit" dengan kode dari email Anda.';
                    document.getElementById('tabContainer').style.display = 'flex';
                    switchTab('otp');
                }
                showAlert('⚠️ ' + msg);
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
                btnText.innerText = 'Simpan Kata Sandi Baru';
            }
        }
    </script>
</body>
</html>
