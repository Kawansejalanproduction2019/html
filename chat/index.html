    <script>
        (function() {
            const savedTheme = localStorage.getItem('rtm_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('rtm_theme', next);
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const btn = document.getElementById('themeToggleBtn');
            if (btn) {
                const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';
                btn.innerHTML = isDark ? '🌙' : '☀️';
            }
        }
        window.addEventListener('DOMContentLoaded', updateThemeIcon);
    </script>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Inter', sans-serif;
}

body {
    background-color: #020617;
    color: #f8fafc;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
}

.desktop-bg {
    display: none;
}

.app-wrapper {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    position: relative;
}

.header {
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    border-bottom: 1px solid #334155;
    padding: 16px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 10;
}

.header-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.bot-avatar {
    width: 45px;
    height: 45px;
    background: linear-gradient(135deg, #0D9488, #14B8A6);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.2);
}

.bot-details {
    display: flex;
    flex-direction: column;
}

.bot-name {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: #f8fafc;
}

.bot-status {
    font-size: 12px;
    color: #0D9488;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
}

.status-dot {
    width: 6px;
    height: 6px;
    background: #0D9488;
    border-radius: 50%;
    animation: pulse 2s infinite;
}

.header-actions {
    display: flex;
    gap: 10px;
    align-items: center;
}

.clear-btn {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #ef4444;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.clear-btn:hover {
    background: #ef4444;
    color: #ffffff;
}

.stop-admin-btn {
    display: none;
    background: rgba(234, 179, 8, 0.1);
    border: 1px solid rgba(234, 179, 8, 0.3);
    color: #eab308;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.3s;
}

.stop-admin-btn:hover {
    background: #eab308;
    color: #ffffff;
}

.chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
}

.chat-container::-webkit-scrollbar {
    width: 6px;
}

.chat-container::-webkit-scrollbar-track {
    background: transparent;
}

.chat-container::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 10px;
}

.msg-wrapper {
    display: flex;
    flex-direction: column;
    max-width: 85%;
    animation: slideIn 0.3s ease-out;
}

.msg-bot {
    align-self: flex-start;
}

.msg-user {
    align-self: flex-end;
    align-items: flex-end;
}

.msg-bubble {
    padding: 14px 18px;
    border-radius: 20px;
    font-size: 14.5px;
    line-height: 1.6;
    word-wrap: break-word;
    word-break: break-word;
    overflow-wrap: break-word;
    max-width: 100%;
    box-shadow: 0 2px 5px rgba(0,0,0,0.02);
}

.msg-bot .msg-bubble {
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    color: #f8fafc;
    border: 1px solid #334155;
    border-top-left-radius: 4px;
}

.msg-user .msg-bubble {
    background: #0D9488;
    color: #ffffff;
    border-top-right-radius: 4px;
    box-shadow: 0 4px 15px rgba(14, 165, 233, 0.2);
}

.long-text-container {
    transition: max-height 0.3s ease;
}

.long-text-container.collapsed {
    max-height: 250px;
    overflow: hidden;
    mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
    -webkit-mask-image: -webkit-linear-gradient(to bottom, black 60%, transparent 100%);
}

.read-more-btn {
    font-size: 12px;
    font-weight: 700;
    margin-top: 8px;
    cursor: pointer;
    text-decoration: underline;
    display: inline-block;
}

.msg-bot .read-more-btn { color: #0ea5e9; }
.msg-user .read-more-btn { color: #e0f2fe; }

.msg-time {
    font-size: 11px;
    color: #94a3b8;
    margin-top: 6px;
    padding: 0 4px;
    font-weight: 500;
}

.typing-indicator {
    display: none;
    align-self: flex-start;
    animation: slideIn 0.3s ease-out;
}

.typing-bubble {
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    border: 1px solid #334155;
    padding: 16px 20px;
    border-radius: 20px;
    border-top-left-radius: 4px;
    width: fit-content;
}

.dots {
    display: flex;
    gap: 4px;
    align-items: center;
    height: 16px;
}

.dot {
    width: 6px;
    height: 6px;
    background: #94a3b8;
    border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
}

.dot:nth-child(1) {
    animation-delay: -0.32s;
}

.dot:nth-child(2) {
    animation-delay: -0.16s;
}

.image-preview-container {
    display: none;
    padding: 10px 20px;
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    border-top: 1px solid #334155;
}

.img-preview {
    max-height: 80px;
    border-radius: 8px;
}

.remove-img-btn {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: none;
    padding: 4px 8px;
    border-radius: 4px;
    font-size: 11px;
    cursor: pointer;
    margin-top: 6px;
    display: block;
    transition: 0.3s;
}

.input-area {
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    border-top: 1px solid #334155;
    padding: 15px 20px;
}

.input-box {
    display: flex;
    gap: 6px;
    background: #020617;
    border: 1px solid #334155;
    border-radius: 24px;
    padding: 6px;
    align-items: center;
    transition: all 0.3s ease;
}

.input-box:focus-within {
    border-color: #14B8A6;
    box-shadow: 0 0 0 3px rgba(14, 165, 233, 0.1);
}

.action-btn {
    width: 40px;
    height: 40px;
    border-radius: 18px;
    background: transparent;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.3s;
}

.action-btn:hover {
    color: #14B8A6;
    background: rgba(14, 165, 233, 0.1);
}

.text-input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 12px 10px;
    color: #f8fafc;
    font-size: 15px;
    outline: none;
}

.text-input::placeholder {
    color: #64748b;
}

.send-btn {
    width: 40px;
    height: 40px;
    border-radius: 18px;
    background: #14B8A6;
    border: none;
    color: white;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    transition: 0.3s;
}

.send-btn:hover {
    background: #0284C7;
    transform: scale(1.05);
}

.admin-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(2, 6, 23, 0.9);
    z-index: 2000;
    justify-content: center;
    align-items: center;
    backdrop-filter: blur(5px);
}

.modal-content {
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    padding: 30px;
    border-radius: 20px;
    border: 1px solid #334155;
    width: 90%;
    max-width: 400px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    animation: slideIn 0.3s ease-out;
}

.password-wrapper {
    position: relative;
    width: 100%;
    margin-bottom: 15px;
}

.modal-input {
    width: 100%;
    padding: 15px;
    padding-right: 40px;
    background: #020617;
    border: 1px solid #334155;
    border-radius: 12px;
    color: white;
    outline: none;
    font-size: 15px;
    transition: 0.3s;
}

.modal-input:focus {
    border-color: #0ea5e9;
}

.toggle-pwd-btn {
    position: absolute;
    right: 12px;
    top: 15px;
    background: transparent;
    border: none;
    color: #94a3b8;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
}

.modal-btn {
    background: #0ea5e9;
    color: white;
    border: none;
    padding: 15px;
    border-radius: 12px;
    cursor: pointer;
    width: 100%;
    font-weight: 700;
    font-size: 15px;
    transition: 0.3s;
}

.modal-btn:hover {
    background: #0284c7;
}

.admin-dashboard {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    background: #0f172a;
    z-index: 1000;
    flex-direction: row;
}

.admin-sidebar {
    display: flex;
    flex-direction: column;
    width: 100%;
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    border-right: 1px solid #334155;
    flex: none;
}

.admin-main {
    display: none;
    flex-direction: column;
    width: 100%;
    background: #0f172a;
    flex: 1;
}

.admin-dashboard.show-chat .admin-sidebar {
    display: none;
}

.admin-dashboard.show-chat .admin-main {
    display: flex;
}

.admin-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 20px;
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    border-bottom: 1px solid #334155;
}

.admin-header h3 {
    font-size: 16px;
    color: #f8fafc;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.close-dash-btn {
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: 0.3s;
}

.close-dash-btn:hover {
    background: #ef4444;
    color: #ffffff;
}

.back-btn {
    background: transparent;
    border: none;
    color: #0ea5e9;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
}

.admin-session-list {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    background: #0f172a;
}

.admin-session-list::-webkit-scrollbar {
    width: 6px;
}

.admin-session-list::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 10px;
}

.session-item {
    padding: 16px;
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    border: 1px solid #334155;
    border-radius: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: 0.3s;
    font-weight: 500;
}

.session-item:hover {
    border-color: #0ea5e9;
    transform: translateY(-2px);
}

.session-item.active {
    border-color: #0ea5e9;
    background: rgba(14, 165, 233, 0.1);
}

.admin-chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    scroll-behavior: smooth;
}

.admin-chat-area::-webkit-scrollbar {
    width: 6px;
}

.admin-chat-area::-webkit-scrollbar-thumb {
    background: #334155;
    border-radius: 10px;
}

.empty-state {
    text-align: center;
    color: #64748b;
    margin-top: 40px;
    font-size: 14px;
    background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
    padding: 20px;
    border-radius: 12px;
    border: 1px dashed #334155;
}

.resolve-btn {
    display: none;
    background: rgba(239, 68, 68, 0.1);
    color: #ef4444;
    border: 1px solid rgba(239, 68, 68, 0.3);
    padding: 8px 14px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: 0.3s;
}

.resolve-btn:hover {
    background: #ef4444;
    color: #ffffff;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

@keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
}

@media (min-width: 900px) {
    body {
        background-color: #f8fafc;
        color: #0f172a;
        justify-content: center;
        align-items: center;
    }
    
    .desktop-bg {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background-image: radial-gradient(circle at 15% 50%, rgba(14, 165, 233, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.15), transparent 25%);
    }
    
    .app-wrapper {
        width: 1000px;
        height: 85vh;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        overflow: hidden;
    }
    
    .header {
        background: rgba(255, 255, 255, 0.85);
        border-bottom: 1px solid #e2e8f0;
    }
    
    .bot-name { color: #0f172a; }
    .msg-bot .msg-bubble { background: #ffffff; color: #0f172a; border: 1px solid #e2e8f0; }
    .input-area { background: rgba(255, 255, 255, 0.85); border-top: 1px solid #e2e8f0; }
    .input-box { background: #ffffff; border: 1px solid #e2e8f0; }
    .text-input { color: #0f172a; }
    
    .admin-dashboard {
        width: 1000px;
        height: 85vh;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: 24px;
        border: 1px solid #334155;
        overflow: hidden;
        flex-direction: row;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }
    
    .admin-sidebar {
        display: flex !important;
        width: 320px;
        border-right: 1px solid #334155;
        flex: none;
    }
    
    .admin-main {
        display: flex !important;
        flex: 1;
    }
    
    .admin-dashboard.show-chat .admin-sidebar {
        display: flex !important;
    }
    
    .admin-dashboard.show-chat .admin-main {
        display: flex !important;
    }
    
    .back-btn { display: none; }
}

            --bg-primary: #F8FAFC;
            --bg-secondary: #FFFFFF;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(226, 232, 240, 0.9);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --accent-emerald: #0D9488;
            --accent-emerald-light: #0F766E;
            --accent-gold: #D97706;
            --shadow-color: rgba(15, 23, 42, 0.08);
        }
        .theme-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 8px 20px var(--shadow-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-primary);
        }
        .theme-toggle-btn:hover {
            transform: scale(1.1) rotate(15deg);
            border-color: var(--accent-emerald);
        }
        [data-theme="light"] body {
            background-color: var(--bg-primary) !important;
            color: var(--text-primary) !important;
        }
        [data-theme="light"] .card, 
        [data-theme="light"] .profile-card,
        [data-theme="light"] .link-item,
        [data-theme="light"] .header,
        [data-theme="light"] .navbar {
            background: var(--card-bg) !important;
            border-color: var(--card-border) !important;
            color: var(--text-primary) !important;
        }
        [data-theme="light"] .brand-name,
        [data-theme="light"] .title,
        [data-theme="light"] .section-title,
        [data-theme="light"] .hero-title {
            color: var(--text-primary) !important;
            background: none !important;
            -webkit-text-fill-color: var(--text-primary) !important;
        }

</style>
</head>
<body>
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Ganti Tema">🌙</button>

<div class="desktop-bg"></div>

<div class="app-wrapper">
    <div class="header">
        <div class="header-info">
            <div class="bot-avatar" id="botAvatarLogo">🤖</div>
            <div class="bot-details">
                <div class="bot-name">RTMbot</div>
                <div class="bot-status"><div class="status-dot"></div> Online</div>
            </div>
        </div>
        <div class="header-actions">
            <button class="stop-admin-btn" id="stopAdminBtn">Akhiri Admin</button>
            <button class="clear-btn" id="clearBtn">Clear</button>
        </div>
    </div>

    <div class="chat-container" id="chatArea"></div>
    
    <div class="msg-wrapper msg-bot" id="typing" style="display: none; padding-left: 20px; margin-bottom: 20px;">
        <div class="typing-bubble">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
    </div>

    <div class="image-preview-container" id="imgPreviewContainer">
        <img id="imgPreview" class="img-preview" src="">
        <button class="remove-img-btn" id="removeImgBtn">Hapus Lampiran</button>
    </div>

    <div class="input-area">
        <div class="input-box">
            <input type="file" id="fileInput" accept="image/*" style="display: none;">
            <button class="action-btn" id="attachBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </button>
            <button class="action-btn" id="micBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
            </button>
            <input type="text" class="text-input" id="userInput" placeholder="Ketik pesan..." autocomplete="off">
            <button class="send-btn" id="sendBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>
</div>

<div class="admin-dashboard" id="adminDashboard">
    <div class="admin-sidebar">
        <div class="admin-header">
            <h3>Antrean Bantuan</h3>
            <button class="close-dash-btn" id="closeDashBtn">Tutup Panel</button>
        </div>
        <div class="admin-session-list" id="adminSessionList"></div>
    </div>
    
    <div class="admin-main">
        <div class="admin-header">
            <button class="back-btn" id="adminBackBtn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Kembali
            </button>
            <h3 id="adminActiveUserText">Ruang Chat Admin</h3>
            <button class="resolve-btn" id="resolveBtn">Selesaikan</button>
        </div>
        <div class="admin-chat-area" id="adminChatArea">
            <div class="empty-state">Pilih pesan dari daftar untuk mulai membalas.</div>
        </div>
        <div class="input-area" id="adminInputArea" style="display: none;">
            <div class="input-box">
                <input type="text" class="text-input" id="adminInput" placeholder="Ketik balasan admin..." autocomplete="off">
                <button class="send-btn" id="adminSendBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="admin-modal" id="adminModal">
    <div class="modal-content">
        <h3 style="margin-bottom:20px; font-weight: 800;">Akses Ruang Admin</h3>
        <div class="password-wrapper">
            <input type="password" class="modal-input" id="adminPasswordInput" placeholder="Masukkan Password Keamanan">
            <button class="toggle-pwd-btn" id="togglePwdBtn">
                <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>
        <button class="modal-btn" id="loginAdminBtn">Autentikasi Sekarang</button>
    </div>
</div>
