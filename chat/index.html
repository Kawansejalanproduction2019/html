<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RTMbot AI Assistant: Obrolan Cerdas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../rtm-design-system.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

  <script>
    (function() {
      const savedTheme = localStorage.getItem('rtm_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('rtm_theme', next);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const icon = document.getElementById('themeIconSvg');
      if (!icon) return;
      const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';
      if (isDark) {
        icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      } else {
        icon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
      }
    }
    window.addEventListener('DOMContentLoaded', updateThemeIcon);
  </script>

  <style>
    body {
      background-color: var(--rtm-bg);
      color: var(--rtm-text-main);
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      font-family: var(--font-body);
    }

    .chat-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      background: var(--rtm-surface);
      border-left: 1px solid var(--rtm-border);
      border-right: 1px solid var(--rtm-border);
      position: relative;
    }

    @media (max-width: 1100px) {
      .chat-layout {
        border-left: none;
        border-right: none;
      }
    }

    /* TOP HEADER */
    .chat-header {
      background: var(--rtm-surface);
      border-bottom: 1px solid var(--rtm-border);
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      gap: 12px;
      backdrop-filter: blur(12px);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      color: var(--rtm-text-secondary);
      background: var(--rtm-surface-elevated);
      border: 1px solid var(--rtm-border);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .nav-back-link:hover {
      color: var(--rtm-primary-light);
      border-color: var(--rtm-primary);
    }

    .bot-avatar {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--rtm-primary), var(--rtm-primary-light));
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      cursor: pointer;
      user-select: none;
      box-shadow: 0 4px 14px rgba(13, 148, 136, 0.25);
      transition: transform 0.2s ease;
      flex-shrink: 0;
    }

    .bot-avatar:active {
      transform: scale(0.94);
    }

    .bot-info {
      display: flex;
      flex-direction: column;
    }

    .bot-title {
      font-family: var(--font-heading);
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--rtm-text-main);
      line-height: 1.2;
    }

    .bot-status {
      font-size: 0.78rem;
      color: var(--rtm-primary-light);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 2px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--rtm-primary-light);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--rtm-primary-light);
      animation: pulse 2s infinite;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stop-admin-btn {
      display: none;
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid rgba(217, 119, 6, 0.35);
      color: var(--rtm-accent-gold);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 40px;
    }

    .stop-admin-btn:hover {
      background: var(--rtm-accent-gold);
      color: #FFFFFF;
    }

    .clear-btn {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #EF4444;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      min-height: 40px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .clear-btn:hover {
      background: #EF4444;
      color: #FFFFFF;
    }

    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-sm);
      background: var(--rtm-surface-elevated);
      border: 1px solid var(--rtm-border);
      color: var(--rtm-text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .theme-btn:hover {
      border-color: var(--rtm-primary);
    }

    /* CHAT STREAM */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    .chat-container::-webkit-scrollbar {
      width: 6px;
    }

    .chat-container::-webkit-scrollbar-thumb {
      background: var(--rtm-border);
      border-radius: var(--radius-pill);
    }

    .msg-wrapper {
      display: flex;
      flex-direction: column;
      max-width: 82%;
      animation: msgFadeIn 0.25s ease-out;
    }

    .msg-bot {
      align-self: flex-start;
    }

    .msg-user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-bubble {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-wrap: break-word;
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
      box-shadow: var(--rtm-shadow-sm);
    }

    .msg-bot .msg-bubble {
      background: var(--rtm-surface-elevated);
      color: var(--rtm-text-main);
      border: 1px solid var(--rtm-border);
      border-top-left-radius: 4px;
    }

    .msg-bot .msg-bubble p {
      margin-bottom: 8px;
    }
    .msg-bot .msg-bubble p:last-child {
      margin-bottom: 0;
    }
    .msg-bot .msg-bubble code {
      font-family: var(--font-mono);
      font-size: 0.88em;
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .msg-bot .msg-bubble pre {
      background: rgba(0, 0, 0, 0.4);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 8px 0;
    }
    .msg-bot .msg-bubble pre code {
      background: transparent;
      padding: 0;
    }

    .msg-user .msg-bubble {
      background: var(--rtm-primary);
      color: #FFFFFF;
      border-top-right-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .long-text-container {
      transition: max-height 0.3s ease;
    }

    .long-text-container.collapsed {
      max-height: 240px;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, black 65%, transparent 100%);
      -webkit-mask-image: -webkit-linear-gradient(to bottom, black 65%, transparent 100%);
    }

    .read-more-btn {
      font-size: 0.82rem;
      font-weight: 700;
      margin-top: 8px;
      cursor: pointer;
      text-decoration: underline;
      display: inline-block;
    }

    .msg-bot .read-more-btn { color: var(--rtm-primary-light); }
    .msg-user .read-more-btn { color: #E0F2FE; }

    .msg-time {
      font-size: 0.72rem;
      color: var(--rtm-text-muted);
      margin-top: 5px;
      padding: 0 4px;
      font-weight: 500;
    }

    .typing-indicator {
      display: none;
      align-self: flex-start;
      animation: msgFadeIn 0.25s ease-out;
    }

    .typing-bubble {
      background: var(--rtm-surface-elevated);
      border: 1px solid var(--rtm-border);
      padding: 14px 18px;
      border-radius: 18px;
      border-top-left-radius: 4px;
      width: fit-content;
    }

    .dots {
      display: flex;
      gap: 5px;
      align-items: center;
      height: 16px;
    }

    .dot {
      width: 7px;
      height: 7px;
      background: var(--rtm-primary-light);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    /* IMAGE PREVIEW */
    .image-preview-container {
      display: none;
      padding: 10px 20px;
      background: var(--rtm-surface);
      border-top: 1px solid var(--rtm-border);
    }

    .img-preview {
      max-height: 80px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--rtm-border);
    }

    .remove-img-btn {
      background: rgba(239, 68, 68, 0.12);
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 4px 10px;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      cursor: pointer;
      margin-top: 6px;
      display: block;
      transition: all 0.2s ease;
    }

    /* INPUT SECTION */
    .input-area {
      background: var(--rtm-surface);
      border-top: 1px solid var(--rtm-border);
      padding: 14px 18px;
    }

    .input-box {
      display: flex;
      gap: 8px;
      background: var(--rtm-surface-elevated);
      border: 1px solid var(--rtm-border);
      border-radius: 28px;
      padding: 6px 10px;
      align-items: center;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-box:focus-within {
      border-color: var(--rtm-primary-light);
      box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.15);
    }

    .action-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--rtm-text-secondary);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .action-btn:hover {
      color: var(--rtm-primary-light);
      background: rgba(13, 148, 136, 0.1);
    }

    .text-input {
      flex: 1;
      background: transparent;
      border: none;
      padding: 10px 8px;
      color: var(--rtm-text-main);
      font-size: 0.95rem;
      font-family: var(--font-body);
      outline: none;
    }

    .text-input::placeholder {
      color: var(--rtm-text-muted);
    }

    .send-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--rtm-primary);
      border: none;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .send-btn:hover {
      background: var(--rtm-primary-hover);
      transform: scale(1.05);
    }

    /* ADMIN MODAL & DASHBOARD */
    .admin-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      backdrop-filter: blur(8px);
      padding: 20px;
    }

    .modal-content {
      background: var(--rtm-surface);
      padding: 32px 28px;
      border-radius: var(--radius-lg);
      border: 1px solid var(--rtm-border);
      width: 100%;
      max-width: 420px;
      text-align: center;
      box-shadow: var(--rtm-shadow-lg);
      animation: msgFadeIn 0.3s ease-out;
    }

    .password-wrapper {
      position: relative;
      width: 100%;
      margin: 18px 0;
    }

    .modal-input {
      width: 100%;
      padding: 14px 44px 14px 14px;
      background: var(--rtm-surface-elevated);
      border: 1px solid var(--rtm-border);
      border-radius: var(--radius-sm);
      color: var(--rtm-text-main);
      outline: none;
      font-size: 0.95rem;
      font-family: var(--font-body);
      transition: border-color 0.2s ease;
    }

    .modal-input:focus {
      border-color: var(--rtm-primary-light);
    }

    .toggle-pwd-btn {
      position: absolute;
      right: 10px;
      top: 12px;
      background: transparent;
      border: none;
      color: var(--rtm-text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
    }

    .modal-btn {
      background: var(--rtm-primary);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      width: 100%;
      font-weight: 700;
      font-size: 0.95rem;
      transition: background-color 0.2s ease;
      min-height: 44px;
    }

    .modal-btn:hover {
      background: var(--rtm-primary-hover);
    }

    .admin-dashboard {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background: var(--rtm-bg);
      z-index: 1000;
      flex-direction: row;
    }

    .admin-sidebar {
      display: flex;
      flex-direction: column;
      width: 100%;
      background: var(--rtm-surface);
      border-right: 1px solid var(--rtm-border);
      flex: none;
    }

    .admin-main {
      display: none;
      flex-direction: column;
      width: 100%;
      background: var(--rtm-bg);
      flex: 1;
    }

    .admin-dashboard.show-chat .admin-sidebar {
      display: none;
    }

    .admin-dashboard.show-chat .admin-main {
      display: flex;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      background: var(--rtm-surface);
      border-bottom: 1px solid var(--rtm-border);
    }

    .admin-header h3 {
      font-size: 1rem;
      color: var(--rtm-text-main);
      font-weight: 800;
      font-family: var(--font-heading);
    }

    .close-dash-btn {
      background: rgba(239, 68, 68, 0.1);
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.25);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.82rem;
      min-height: 40px;
    }

    .back-btn {
      background: transparent;
      border: none;
      color: var(--rtm-primary-light);
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 40px;
    }

    .admin-session-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--rtm-bg);
    }

    .session-item {
      padding: 14px 18px;
      background: var(--rtm-surface);
      border: 1px solid var(--rtm-border);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s ease;
      font-weight: 600;
    }

    .session-item:hover, .session-item.active {
      border-color: var(--rtm-primary-light);
      background: rgba(13, 148, 136, 0.1);
    }

    .admin-chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .empty-state {
      text-align: center;
      color: var(--rtm-text-muted);
      margin-top: 40px;
      font-size: 0.9rem;
      background: var(--rtm-surface);
      padding: 24px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--rtm-border);
    }

    .resolve-btn {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      color: #EF4444;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-weight: 700;
      cursor: pointer;
      font-size: 0.82rem;
      min-height: 40px;
    }

    @media (min-width: 900px) {
      .admin-dashboard {
        width: 1000px;
        height: 85vh;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border-radius: var(--radius-lg);
        border: 1px solid var(--rtm-border);
        overflow: hidden;
        flex-direction: row;
        box-shadow: var(--rtm-shadow-lg);
      }
      .admin-sidebar {
        display: flex !important;
        width: 320px;
        border-right: 1px solid var(--rtm-border);
        flex: none;
      }
      .admin-main {
        display: flex !important;
        flex: 1;
      }
      .admin-dashboard.show-chat .admin-sidebar {
        display: flex !important;
      }
      .admin-dashboard.show-chat .admin-main {
        display: flex !important;
      }
      .back-btn { display: none; }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    @keyframes msgFadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="chat-layout">
    <!-- HEADER -->
    <header class="chat-header">
      <div class="header-left">
        <a href="../index.html" class="nav-back-link" title="Kembali ke Portal Hub">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </a>
        <div class="bot-avatar" id="botAvatarLogo" title="Ketuk 5 kali untuk akses Admin Desk">🤖</div>
        <div class="bot-info">
          <div class="bot-title">RTMbot AI</div>
          <div class="bot-status"><span class="status-dot"></span> Online &bull; Siap Membantu</div>
        </div>
      </div>

      <div class="header-actions">
        <button class="stop-admin-btn" id="stopAdminBtn">Akhiri Admin</button>
        <button class="clear-btn" id="clearBtn" title="Hapus Riwayat Chat">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Clear
        </button>
        <button id="themeToggleBtn" class="theme-btn" onclick="toggleTheme()" title="Ganti Mode Gelap / Terang">
          <svg id="themeIconSvg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- CHAT MESSAGES STREAM -->
    <main class="chat-container" id="chatArea"></main>

    <!-- TYPING INDICATOR -->
    <div class="msg-wrapper msg-bot" id="typing" style="display: none; padding-left: 20px; margin-bottom: 16px;">
      <div class="typing-bubble">
        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>

    <!-- IMAGE PREVIEW -->
    <div class="image-preview-container" id="imgPreviewContainer">
      <img id="imgPreview" class="img-preview" src="" alt="Lampiran Unggahan">
      <button class="remove-img-btn" id="removeImgBtn">Hapus Lampiran</button>
    </div>

    <!-- INPUT DOCK -->
    <div class="input-area">
      <div class="input-box">
