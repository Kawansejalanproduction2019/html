<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>RTMbot | Developer Console</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        :root {
            --term-bg: #0D1117;
            --term-card: #161B22;
            --term-border: #30363D;
            --term-text: #F0F6FC;
            --term-muted: #8B949E;
            --term-green: #3FB950;
            --term-green-btn: #238636;
            --term-green-btn-hover: #2EA043;
            --term-blue: #58A6FF;
            --term-amber: #D29922;
            --term-red: #F85149;
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-mono);
        }

        body {
            background-color: #04070D;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(35, 134, 54, 0.08), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(88, 166, 255, 0.06), transparent 35%);
            color: var(--term-text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 16px;
        }

        /* Console Window Frame */
        .terminal-window {
            width: 100%;
            max-width: 980px;
            height: 90vh;
            max-height: 860px;
            background: var(--term-bg);
            border: 1px solid var(--term-border);
            border-radius: 18px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.75), 0 0 20px rgba(35, 134, 54, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Terminal Window Header (Mac Controls) */
        .terminal-header {
            background: rgba(22, 27, 34, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--term-border);
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .window-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-red { background: #FF5F56; }
        .dot-yellow { background: #FFBD2E; }
        .dot-green { background: #27C93F; }

        .terminal-status-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .cluster-status-text {
            font-size: 0.8rem;
            color: var(--term-muted);
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot-pulse {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--term-green);
            box-shadow: 0 0 8px rgba(63, 185, 80, 0.8);
            animation: statusPulse 2s infinite;
        }

        @keyframes statusPulse {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }

        .e2ee-tag-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--term-green);
            background: rgba(63, 185, 80, 0.12);
            border: 1px solid rgba(63, 185, 80, 0.3);
            padding: 2px 8px;
            border-radius: 999px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-term-clear {
            background: rgba(248, 81, 73, 0.12);
            border: 1px solid rgba(248, 81, 73, 0.3);
            color: #FFA198;
            font-size: 0.74rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-term-clear:hover {
            background: var(--term-red);
            color: #FFFFFF;
        }

        .btn-stop-handoff {
            display: none;
            background: rgba(210, 153, 34, 0.15);
            border: 1px solid rgba(210, 153, 34, 0.4);
            color: var(--term-amber);
            font-size: 0.74rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-stop-handoff:hover {
            background: var(--term-amber);
            color: #000000;
        }

        .btn-term-admin {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #FBBF24;
            font-size: 0.74rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .btn-term-admin:hover {
            background: #F59E0B;
            color: #000000;
        }

        /* Terminal Canvas Stream */
        .terminal-canvas {
            flex: 1;
            overflow-y: auto;
            padding: 22px 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
            scroll-behavior: smooth;
        }

        .terminal-canvas::-webkit-scrollbar {
            width: 6px;
        }

        .terminal-canvas::-webkit-scrollbar-thumb {
            background: var(--term-border);
            border-radius: 10px;
        }

        .terminal-entry {
            display: flex;
            flex-direction: column;
            gap: 4px;
            animation: fadeInTerminal 0.15s ease-out;
        }

        @keyframes fadeInTerminal {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .terminal-entry.system {
            color: #79C0FF;
            font-size: 0.88rem;
        }

        .terminal-entry.user .terminal-prompt-user {
            color: var(--term-blue);
            font-weight: 700;
        }

        .terminal-entry.user .terminal-content {
            color: #F0F6FC;
            background: rgba(88, 166, 255, 0.06);
            border-left: 2px solid var(--term-blue);
            padding: 8px 12px;
            border-radius: 0 8px 8px 0;
            margin-top: 2px;
        }

        .terminal-entry.bot .terminal-prompt-bot {
            color: var(--term-green);
            font-weight: 700;
        }

        .terminal-entry.bot .terminal-content {
            color: #E6EDF3;
            background: rgba(22, 27, 34, 0.7);
            border-left: 2px solid var(--term-green);
            padding: 10px 14px;
            border-radius: 0 8px 8px 0;
            margin-top: 2px;
            word-break: break-word;
        }

        .terminal-content pre {
            background: #000000;
            border: 1px solid var(--term-border);
            border-radius: 8px;
            padding: 10px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .terminal-content code {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.08);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .terminal-content pre code {
            background: transparent;
            padding: 0;
        }

        .terminal-time {
            font-size: 0.72rem;
            color: var(--term-muted);
            margin-left: 8px;
            font-weight: 400;
        }

        .attached-media-preview {
            max-width: 280px;
            border-radius: 8px;
            border: 1px solid var(--term-border);
            margin-top: 8px;
            display: block;
        }

        /* Typing Dots Indicator */
        .terminal-typing {
            display: none;
            align-items: center;
            gap: 6px;
            color: var(--term-green);
            font-size: 0.85rem;
            padding: 4px 10px;
        }

        .typing-cursor {
            display: inline-block;
            width: 8px;
            height: 15px;
            background: var(--term-green);
            vertical-align: middle;
            animation: cursorBlink 0.8s infinite;
        }

        @keyframes cursorBlink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* File Preview Bar Before Sending */
        .image-preview-bar {
            display: none;
            background: rgba(22, 27, 34, 0.9);
            border-top: 1px solid var(--term-border);
            padding: 10px 20px;
            align-items: center;
            gap: 12px;
        }

        .img-preview-thumb {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid var(--term-green);
        }

        .btn-cancel-attach {
            background: transparent;
            border: 1px solid rgba(248, 81, 73, 0.4);
            color: #FFA198;
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Bottom Command Input Bar */
        .terminal-input-bar {
            background: var(--term-card);
            border-top: 1px solid var(--term-border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .terminal-input-wrap {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--term-bg);
            border: 1px solid var(--term-border);
            border-radius: 10px;
            padding: 6px 14px;
            transition: border-color 0.15s ease;
        }

        .terminal-input-wrap:focus-within {
            border-color: var(--term-green);
            box-shadow: 0 0 0 1px var(--term-green);
        }

        .terminal-prompt-prefix {
            color: var(--term-green);
            font-weight: 700;
            font-size: 1.1rem;
            user-select: none;
        }

        .cmd-text-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--term-text);
            font-size: 0.92rem;
            font-family: var(--font-mono);
            min-height: 32px;
        }

        .cmd-text-input::placeholder {
            color: #6E7681;
        }

        .input-icon-btn {
            background: transparent;
            border: none;
            color: var(--term-muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            border-radius: 6px;
            transition: color 0.15s ease, background 0.15s ease;
        }

        .input-icon-btn:hover {
            color: var(--term-text);
            background: rgba(255, 255, 255, 0.06);
        }

        .btn-terminal-run {
            background: var(--term-green-btn);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            padding: 10px 22px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.15s ease, transform 0.1s ease;
            white-space: nowrap;
        }

        .btn-terminal-run:hover {
            background: var(--term-green-btn-hover);
        }

        .btn-terminal-run:active {
            transform: scale(0.98);
        }

        @media (max-width: 640px) {
            body { padding: 0; }
            .terminal-window {
                height: 100dvh;
                max-height: 100dvh;
                border-radius: 0;
                border: none;
            }
            .terminal-input-bar {
                padding: 10px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="terminal-window">
        <!-- Terminal Header with Mac-style Dots & Status -->
        <div class="terminal-header">
            <div class="window-controls">
                <span class="window-dot dot-red" title="Close"></span>
                <span class="window-dot dot-yellow" title="Minimize"></span>
                <span class="window-dot dot-green" title="Maximize"></span>
            </div>

            <div class="terminal-status-info">
                <span class="cluster-status-text">
                    <span class="status-dot-pulse"></span> cluster-id-cgk &bull; online
                </span>
            </div>

            <div class="header-actions">
                <button type="button" class="btn-stop-handoff" id="stopAdminBtn" onclick="endHandoff('Sesi admin diakhiri.')">Akhiri CS</button>
                <button type="button" class="btn-term-clear" id="clearBtn" onclick="clearConsole()">Clear</button>
            </div>
        </div>

        <!-- Terminal Output Stream -->
        <div class="terminal-canvas" id="terminalArea">
            <div class="terminal-entry system">
                <div><span style="color: var(--term-green); font-weight: 700;">rtmbot@cluster:~$</span> Sistem siap. Silakan ketik pesan atau ajukan pertanyaan.</div>
            </div>
        </div>

        <!-- Typing Indicator -->
        <div class="terminal-typing" id="typingIndicator">
            <span>rtmbot@cluster:~$ Mengetik</span><span class="typing-cursor"></span>
        </div>

        <!-- Image Attachment Preview Bar -->
        <div class="image-preview-bar" id="imgPreviewBar">
            <img id="imgPreviewThumb" class="img-preview-thumb" src="" alt="Lampiran">
            <span style="font-size: 0.78rem; color: var(--term-muted);">Gambar siap diunggah</span>
            <button type="button" class="btn-cancel-attach" onclick="clearAttachment()">Batal</button>
        </div>

        <!-- Bottom Command Input Bar -->
        <form class="terminal-input-bar" onsubmit="handleCommandSubmit(event)">
            <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelected(event)">

            <div class="terminal-input-wrap">
                <span class="terminal-prompt-prefix">&gt;</span>
                <input type="text" id="commandInput" class="cmd-text-input" placeholder="Ketikkan pesan Anda di sini..." autocomplete="off">
                
                <button type="button" class="input-icon-btn" onclick="document.getElementById('fileInput').click()" title="Lampirkan Gambar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                    </svg>
                </button>

                <button type="button" class="input-icon-btn" id="micBtn" title="Input Suara">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                </button>
            </div>

            <button type="submit" class="btn-terminal-run" id="btnRun">
                <span>Kirim</span>
            </button>
        </form>
    </div>

    <script>
        const API_BASE = 'https://api.rtmbot.biz.id';
        const E2EE_SHARED_SALT = 'RTM_E2EE_SECURE_KEY_99X';
        const MASTER_NET_SALT = 'RTM_CORE_LAYER2_SEC_88X';

        let chatHistory = [];
        try {
            const saved = localStorage.getItem('rtmbot_chat_history');
            if (saved) {
                const parsed = JSON.parse(saved);
                if (Array.isArray(parsed)) chatHistory = parsed;
            }
        } catch (e) {
            chatHistory = [];
        }

        let currentBase64 = null;
        let sessionId = localStorage.getItem('rtmbot_session_id');
        let currentApiToken = null;
        let isHandoffActive = localStorage.getItem('rtmbot_handoff_active') === 'true';
        let pollingInterval = null;
        let lastAdminMsgId = parseInt(localStorage.getItem('rtmbot_last_admin_msg_id') || '0');
        let historyRestored = false;

        if (!sessionId) {
            sessionId = 'user_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
            localStorage.setItem('rtmbot_session_id', sessionId);
        }

        // --- MULTI-LAYER ENVELOPE ENCRYPTION HELPERS ---
        function deriveSessionKey(sid) {
            return CryptoJS.SHA256((sid || sessionId || 'rtm_session') + E2EE_SHARED_SALT).toString();
        }

        function deriveOuterKey(sid) {
            return CryptoJS.SHA256(deriveSessionKey(sid) + MASTER_NET_SALT).toString();
        }

        function multiLayerEncrypt(plainText, sid, imgBase64 = null) {
            if (!plainText && !imgBase64) return '';
            try {
                const payloadObj = {
                    t: typeof plainText === 'string' ? plainText : String(plainText || ''),
                    ts: Date.now(),
                    n: Math.random().toString(36).substring(2, 9)
                };
                if (imgBase64) payloadObj.img = imgBase64;

                const innerKey = deriveSessionKey(sid);
                const innerJson = JSON.stringify(payloadObj);
                const layer1Cipher = CryptoJS.AES.encrypt(innerJson, innerKey).toString();

                const outerKey = deriveOuterKey(sid);
                const hmacSig = CryptoJS.HmacSHA256(layer1Cipher, outerKey).toString();
                const envelopeObj = { c: layer1Cipher, s: hmacSig };
                const outerJson = JSON.stringify(envelopeObj);
                const finalCipher = CryptoJS.AES.encrypt(outerJson, outerKey).toString();
                return 'E2E2:' + finalCipher;
            } catch (e) {
                console.error('MultiLayer Encrypt Error:', e);
                return plainText;
            }
        }

        function multiLayerDecrypt(cipherText, sid) {
            if (!cipherText || typeof cipherText !== 'string') return { text: cipherText, img: null };
            if (cipherText.startsWith('E2E:')) {
                try {
                    const raw = cipherText.substring(4);
                    const key = deriveSessionKey(sid);
                    const bytes = CryptoJS.AES.decrypt(raw, key);
                    const dec = bytes.toString(CryptoJS.enc.Utf8);
                    return { text: dec || cipherText, img: null };
                } catch (e) {
                    return { text: cipherText, img: null };
                }
            }
            if (!cipherText.startsWith('E2E2:')) {
                return { text: cipherText, img: null };
            }

            try {
                const outerCipher = cipherText.substring(5);
                const outerKey = deriveOuterKey(sid);
                const outerBytes = CryptoJS.AES.decrypt(outerCipher, outerKey);
                const outerJson = outerBytes.toString(CryptoJS.enc.Utf8);
                if (!outerJson) return { text: '[Pesan aman tidak dapat didekripsi]', img: null };

                const envelopeObj = JSON.parse(outerJson);
                const expectedSig = CryptoJS.HmacSHA256(envelopeObj.c, outerKey).toString();
                if (envelopeObj.s !== expectedSig) {
                    return { text: '[Integritas pesan tidak valid]', img: null };
                }

                const innerKey = deriveSessionKey(sid);
                const innerBytes = CryptoJS.AES.decrypt(envelopeObj.c, innerKey);
                const innerJson = innerBytes.toString(CryptoJS.enc.Utf8);
                if (!innerJson) return { text: '[Gagal dekripsi pesan]', img: null };

                const payloadObj = JSON.parse(innerJson);
                return {
                    text: payloadObj.t || '',
                    img: payloadObj.img || null
                };
            } catch (e) {
                console.error('MultiLayer Decrypt Error:', e);
                return { text: '[Pesan aman terenkripsi]', img: null };
            }
        }

        function saveChatHistory() {
            try {
                if (chatHistory.length > 50) {
                    chatHistory = chatHistory.slice(-50);
                }
                localStorage.setItem('rtmbot_chat_history', JSON.stringify(chatHistory));
            } catch (e) {
                console.error('Failed to save chat history:', e);
            }
        }

        // --- API TOKEN FETCHER ---
        async function fetchApiToken() {
            const now = Date.now().toString();
            const sig = CryptoJS.HmacSHA256(sessionId + now, 'RTM_FRONTEND_CORE_99X').toString();
            try {
                const res = await fetch(`${API_BASE}/api/get-token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-RTM-Time': now,
                        'X-RTM-Sig': sig
                    },
                    body: JSON.stringify({ session_id: sessionId })
                });
                if (res.ok) {
                    const data = await res.json();
                    currentApiToken = data.token;
                }
            } catch (e) {
                console.error('Token fetch error:', e);
            }
        }
        fetchApiToken();
        setInterval(fetchApiToken, 50000);

        function getTimeString() {
            const d = new Date();
            return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
        }

        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/[&<>'"]/g, tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag));
        }

        // --- TERMINAL LOG RENDERING ---
        function addTerminalLog(text, role = 'bot', imgData = null) {
            const container = document.getElementById('terminalArea');
            if (!container) return;

            const entry = document.createElement('div');
            entry.className = `terminal-entry ${role}`;

            const timeStr = getTimeString();
            let safeText = typeof text === 'string' ? text : String(text || '');

            // Auto-decrypt safety net: If any encrypted envelope is passed, decrypt immediately
            if (safeText.startsWith('E2E:') || safeText.startsWith('E2E2:')) {
                const dec = multiLayerDecrypt(safeText, sessionId);
                safeText = dec.text;
                if (!imgData && dec.img) imgData = dec.img;
            }

            if (role === 'user') {
                let imgHtml = imgData ? `<img src="data:image/jpeg;base64,${imgData}" class="attached-media-preview" alt="Lampiran">` : '';
                entry.innerHTML = `
                    <div>
                        <span class="terminal-prompt-user">user@terminal:~$</span>
                        <span class="terminal-time">[${timeStr}]</span>
                    </div>
                    <div class="terminal-content">
                        ${escapeHTML(safeText).replace(/\n/g, '<br>')}
                        ${imgHtml}
                    </div>
                `;
            } else if (role === 'system') {
                entry.innerHTML = `
                    <div><span style="color: #79C0FF; font-weight: 700;">system@cluster:~$</span> ${escapeHTML(safeText)}</div>
                `;
            } else {
                let renderedContent = '';
                try {
                    renderedContent = DOMPurify.sanitize(marked.parse(safeText));
                } catch (e) {
                    renderedContent = escapeHTML(safeText).replace(/\n/g, '<br>');
                }
                let imgHtml = imgData ? `<img src="data:image/jpeg;base64,${imgData}" class="attached-media-preview" alt="Lampiran">` : '';
                entry.innerHTML = `
                    <div>
                        <span class="terminal-prompt-bot">rtmbot@cluster:~$</span>
                        <span class="terminal-time">[${timeStr}]</span>
                    </div>
                    <div class="terminal-content">
                        ${renderedContent}
                        ${imgHtml}
                    </div>
                `;
            }

            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        // --- SUBMIT COMMAND / CHAT ---
        async function handleCommandSubmit(e) {
            if (e) e.preventDefault();

            const input = document.getElementById('commandInput');
            const btn = document.getElementById('btnRun');
            const typing = document.getElementById('typingIndicator');
            const messageText = input.value.trim();

            if (!messageText && !currentBase64) return;

            // Direct admin commands in terminal console
            const lowerCmd = messageText.toLowerCase().trim();
            if (lowerCmd === '/admin' || lowerCmd === 'admin' || lowerCmd === '/login' || lowerCmd === 'login' || lowerCmd === 'login admin' || lowerCmd === '/panel') {
                input.value = '';
                addTerminalLog(messageText, 'user');
                addTerminalLog('Mengarahkan ke portal kendali pengelola admin...', 'system');
                setTimeout(() => {
                    window.location.href = '/admin/';
                }, 400);
                return;
            }

            const userText = messageText || 'Berikan pendapatmu mengenai gambar ini.';
            const sendImg = currentBase64;

            input.value = '';
            clearAttachment();

            // Display in terminal stream
            addTerminalLog(userText, 'user', sendImg);

            // Record user message to persistent history immediately
            chatHistory.push({
                role: 'user',
                parts: [{ text: userText }],
                img: sendImg || null
            });
            saveChatHistory();

            // Show typing indicator
            if (typing) typing.style.display = 'flex';
            btn.disabled = true;

            try {
                const reply = await triggerAPI(userText, sendImg);
                if (reply && reply.trim()) {
                    addTerminalLog(reply, 'bot');
                    chatHistory.push({
                        role: 'model',
                        parts: [{ text: reply }]
                    });
                    saveChatHistory();
                }
            } catch (err) {
                addTerminalLog('Terjadi kendala jaringan saat menghubungi server cluster.', 'system');
            } finally {
                if (typing) typing.style.display = 'none';
                btn.disabled = false;
                input.focus();
            }
        }

        async function triggerAPI(rawMessage, imgData) {
            if (!currentApiToken) await fetchApiToken();

            const now = Date.now().toString();
            const sig = CryptoJS.HmacSHA256(sessionId + now, 'RTM_FRONTEND_CORE_99X').toString();

            let payloadMessage = rawMessage;
            if (isHandoffActive && payloadMessage.toLowerCase().trim() !== 'stop admin') {
                payloadMessage = multiLayerEncrypt(payloadMessage, sessionId, imgData);
            }

            const bodyPayload = {
                message: payloadMessage,
                history: chatHistory,
                session_id: sessionId
            };
            if (imgData) bodyPayload.image = imgData;

            const res = await fetch(`${API_BASE}/api/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-RTM-Time': now,
                    'X-RTM-Sig': sig,
                    'Authorization': 'Bearer ' + (currentApiToken || '')
                },
                body: JSON.stringify(bodyPayload)
            });

            const data = await res.json();
            if (!res.ok) {
                return data.reply || 'Koneksiku ke server sedang terganggu.';
            }

            if (data.model === 'bot-resume') {
                endHandoff(data.reply);
                return data.reply;
            }

            if (data.model === 'System-Handoff' || data.model === 'System-Handoff-Silent') {
                isHandoffActive = true;
                localStorage.setItem('rtmbot_handoff_active', 'true');
                const stopBtn = document.getElementById('stopAdminBtn');
                if (stopBtn) stopBtn.style.display = 'inline-block';
                startPollingUser();
                return data.reply;
            }

            if (isHandoffActive) {
                checkAdminRepliesNow();
            }

            return data.reply;
        }

        // --- POLLING HUMAN HANDOFF REPLIES ---
        async function checkAdminRepliesNow() {
            if (!isHandoffActive) return;
            try {
                const res = await fetch(`${API_BASE}/api/get-admin-reply`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ session_id: sessionId, last_id: lastAdminMsgId })
                });
                const data = await res.json();
                if (data.status === 'resolved') {
                    endHandoff('Sesi obrolan dengan admin telah berakhir. RTMbot siap melayani kembali!');
                    return;
                }
                if (Array.isArray(data.messages) && data.messages.length > 0) {
                    data.messages.forEach(m => {
                        if (m.id > lastAdminMsgId) {
                            lastAdminMsgId = m.id;
                            localStorage.setItem('rtmbot_last_admin_msg_id', lastAdminMsgId.toString());
                            const decryptedObj = multiLayerDecrypt(m.message, sessionId);
                            addTerminalLog(decryptedObj.text, 'bot', decryptedObj.img);
                            chatHistory.push({
                                role: 'model',
                                parts: [{ text: decryptedObj.text }],
                                img: decryptedObj.img || null
                            });
                            saveChatHistory();
                        }
                    });
                }
            } catch (e) {}
        }

        function startPollingUser() {
            if (pollingInterval) clearInterval(pollingInterval);
            checkAdminRepliesNow();
            pollingInterval = setInterval(checkAdminRepliesNow, 750);
        }

        function endHandoff(notice) {
            isHandoffActive = false;
            localStorage.removeItem('rtmbot_handoff_active');
            lastAdminMsgId = 0;
            localStorage.setItem('rtmbot_last_admin_msg_id', '0');

            const stopBtn = document.getElementById('stopAdminBtn');
            if (stopBtn) stopBtn.style.display = 'none';

            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
            if (notice) {
                addTerminalLog(notice, 'system');
                chatHistory.push({ role: 'system', parts: [{ text: notice }] });
                saveChatHistory();
            }
        }

        // --- FILE ATTACHMENT HANDLERS ---
        function handleFileSelected(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = ev => {
                const res = ev.target.result;
                document.getElementById('imgPreviewThumb').src = res;
                document.getElementById('imgPreviewBar').style.display = 'flex';
                currentBase64 = res.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        function clearAttachment() {
            currentBase64 = null;
            document.getElementById('imgPreviewBar').style.display = 'none';
            document.getElementById('fileInput').value = '';
        }

        function clearConsole() {
            if (confirm('Hapus seluruh riwayat log terminal?')) {
                chatHistory = [];
                localStorage.removeItem('rtmbot_chat_history');
                const container = document.getElementById('terminalArea');
                container.innerHTML = `
                    <div class="terminal-entry system">
                        <div><span style="color: var(--term-green); font-weight: 700;">rtmbot@cluster:~$</span> Terminal dibersihkan. Sistem siap.</div>
                    </div>
                `;
            }
        }

        // --- SPEECH RECOGNITION (MIC) ---
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            const recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            document.getElementById('micBtn').addEventListener('click', () => {
                try {
                    recognition.start();
                } catch (e) {}
            });
            recognition.addEventListener('result', ev => {
                const transcript = ev.results[0][0].transcript;
                const input = document.getElementById('commandInput');
                input.value += (input.value ? ' ' : '') + transcript;
                input.focus();
            });
        }

        // --- RESTORE HISTORY ON LOAD ---
        function restoreHistory() {
            if (historyRestored) return;
            historyRestored = true;

            if (Array.isArray(chatHistory) && chatHistory.length > 0) {
                chatHistory.forEach(item => {
                    let role = 'bot';
                    if (item.role === 'user' || item.sender === 'user') role = 'user';
                    else if (item.role === 'system' || item.sender === 'system') role = 'system';

                    let text = '';
                    if (item.parts && Array.isArray(item.parts) && item.parts[0] && item.parts[0].text) {
                        text = item.parts[0].text;
                    } else if (typeof item.parts === 'string') {
                        text = item.parts;
                    } else if (item.text) {
                        text = item.text;
                    } else if (item.message) {
                        text = item.message;
                    }

                    let img = item.img || (item.parts && item.parts[0] && item.parts[0].inlineData && item.parts[0].inlineData.data) || null;

                    // Automatically decrypt stored ciphertexts (handles both E2E2 and E2E)
                    if (text && (text.startsWith('E2E:') || text.startsWith('E2E2:'))) {
                        const dec = multiLayerDecrypt(text, sessionId);
                        text = dec.text;
                        if (!img && dec.img) img = dec.img;
                    }

                    if (text || img) {
                        addTerminalLog(text, role, img);
                    }
                });
            }

            // Resume handoff state if active
            if (isHandoffActive) {
                const stopBtn = document.getElementById('stopAdminBtn');
                if (stopBtn) stopBtn.style.display = 'inline-block';
                startPollingUser();
            }
        }

        // Run immediately and also on DOMContentLoaded as safety
        if (document.readyState === 'loading') {
            window.addEventListener('DOMContentLoaded', restoreHistory);
        } else {
            restoreHistory();
        }
    </script>
</body>
