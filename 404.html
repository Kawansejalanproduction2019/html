<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan — RTMBOT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.replace(`https:${location.href.substring(location.protocol.length)}`);
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #F8FAFC;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }
        .bg-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .ambient-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(239,68,68,0.12) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(80px);
        }
        .ambient-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(13,148,136,0.15) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(80px);
        }
        
        .card {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 32px;
            padding: 50px 36px;
            text-align: center;
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            max-width: 460px;
            width: 100%;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #EF4444, #0D9488, #D97706);
        }
        
        .error-code {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 76px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #EF4444, #F8FAFC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .error-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #F8FAFC;
        }
        .error-desc {
            font-size: 14px;
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        
        .btn-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px 28px;
            background: linear-gradient(135deg, #0D9488, #0F766E);
            border: 1px solid rgba(20, 184, 166, 0.5);
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 14px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.4);
        }
        .btn-home:hover {
            transform: translateY(-2px);
            background: linear-gradient(135deg, #14B8A6, #0D9488);
            box-shadow: 0 15px 30px -5px rgba(13, 148, 136, 0.5);
        }
    </style>
</head>
<body>
    <div class="bg-fx">
        <div class="ambient-1"></div>
        <div class="ambient-2"></div>
    </div>
    <div class="card">
        <div class="error-code">404</div>
        <div class="error-title">Halaman Tidak Ditemukan</div>
        <div class="error-desc">Tautan yang Anda tuju mungkin sudah dipindahkan, dihapus, atau alamat URL salah dimasukkan.</div>
        <a href="/" class="btn-home">← Kembali ke Beranda RTMBOT</a>
    </div>
</body>
</html>
