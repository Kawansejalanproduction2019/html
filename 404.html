<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Halaman Tidak Ditemukan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <script>
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.replace(`https:${location.href.substring(location.protocol.length)}`);
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #F8FAFC;
            min-height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
        }
        .bg-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }
        .ambient-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(239,68,68,0.08) 0%, transparent 50%);
            border-radius: 50%;
            filter: blur(80px);
            animation: drift 20s infinite alternate ease-in-out;
        }
        .ambient-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 80vw;
            height: 80vw;
            background: radial-gradient(circle, rgba(20,184,166,0.08) 0%, transparent 50%);
            border-radius: 50%;
            filter: blur(80px);
            animation: drift2 25s infinite alternate ease-in-out;
        }
        @keyframes drift { 100% { transform: translate(15vw, 15vh); } }
        @keyframes drift2 { 100% { transform: translate(-15vw, -15vh); } }
        
        .card {
            position: relative;
            z-index: 1;
            background: rgba(15, 23, 42, 0.4);
            border: 1px solid rgba(51, 65, 85, 0.5);
            border-radius: 35px;
            padding: 60px 40px;
            text-align: center;
            backdrop-filter: blur(20px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            max-width: 450px;
            width: 100%;
            overflow: hidden;
        }
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #EF4444, #14B8A6);
        }
        
        .error-code {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 80px;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(to right, #EF4444, #F8FAFC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #F8FAFC;
        }
        .error-desc {
            font-size: 14px;
            color: #94A3B8;
            line-height: 1.6;
            margin-bottom: 35px;
        }
        
        .back-btn {
            display: inline-block;
            background: #14B8A6;
            color: #020617;
            padding: 16px 32px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 15px;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .back-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(20,184,166,0.4);
        }
        
        .countdown {
            font-size: 12px;
            color: #475569;
            margin-top: 25px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="bg-fx">
        <div class="ambient-1"></div>
        <div class="ambient-2"></div>
    </div>

    <div class="card">
        <div class="error-code">404</div>
        <div class="error-title">Halaman Tidak Ditemukan</div>
        <div class="error-desc">Waduh, URL yang kamu tuju sepertinya salah ketik atau halamannya sudah dipindahkan.</div>
        <a href="/" class="back-btn">Kembali ke Beranda</a>
        <div class="countdown" id="cdText">Otomatis dialihkan dalam 5 detik...</div>
    </div>

    <script>
        let waktu = 5;
        const textEl = document.getElementById("cdText");
        setInterval(() => {
            waktu--;
            if(waktu > 0) {
                textEl.innerText = `Otomatis dialihkan dalam ${waktu} detik...`;
            } else {
                window.location.href = "/";
            }
        }, 1000);
    </script>
</body>
</html>
