<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404: Halaman Tidak Ditemukan - RTMBOT</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="rtm-design-system.css">

  <script>
    (function() {
      const saved = localStorage.getItem('rtm_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', saved);
    })();
  </script>

  <style>
    .notfound-container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px 20px;
      text-align: center;
    }

    .notfound-card {
      background: var(--rtm-surface);
      border: 1px solid var(--rtm-border);
      border-radius: var(--radius-lg);
      padding: 48px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: var(--rtm-shadow-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .error-code {
      font-family: var(--font-mono);
      font-size: clamp(3.5rem, 8vw, 5rem);
      font-weight: 800;
      color: var(--rtm-primary-light);
      line-height: 1;
    }

    .error-title {
      font-size: 1.45rem;
      font-weight: 800;
    }

    .error-desc {
      font-size: 0.95rem;
      color: var(--rtm-text-secondary);
      line-height: 1.6;
      margin-bottom: 8px;
    }

    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <main class="notfound-container">
    <div class="notfound-card">
      <div class="error-code">404</div>
      <h1 class="error-title">Halaman Tidak Ditemukan</h1>
      <p class="error-desc">
        Tautan yang Anda tuju mungkin telah dipindahkan, berganti nama, atau sudah tidak tersedia di ekosistem RTMBOT.
      </p>
      <div class="action-row">
        <a href="/" class="rtm-btn-link rtm-btn-primary">Kembali ke Beranda Hub</a>
        <a href="/quran/" class="rtm-btn-link">Buka Al-Quran</a>
      </div>
    </div>
  </main>

  <footer class="rtm-footer" style="position: absolute; bottom: 0; width: 100%;">
    <p>&copy; 2026 RTMBOT Solutions.</p>
  </footer>

</body>
</html>
