<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="hegC6QGjlcZtAX7SPgJhRO4Cdht479-PehDHq2HpZp4" />
    <title>RTMBOT — Ekosistem Digital &amp; Platform Islami</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        (function() {
            const saved = localStorage.getItem('rtm_theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', saved);
            if (window.location.hash && (window.location.hash.includes('type=recovery') || window.location.hash.includes('access_token'))) {
                window.location.replace('/reset-password.html' + window.location.hash);
            } else if (window.location.search && (window.location.search.includes('type=recovery') || window.location.search.includes('token_hash'))) {
                window.location.replace('/reset-password.html' + window.location.search);
            }
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                location.replace(`https:${location.href.substring(location.protocol.length)}`);
            }
        })();
    </script>
    <style>
        :root {
            --bg-body: #000000;
            --bg-card: rgba(12, 18, 30, 0.85);
            --bg-item: rgba(18, 26, 42, 0.6);
            --border-card: rgba(30, 41, 59, 0.8);
            --border-hover: #0D9488;
            --text-title: #FFFFFF;
            --text-body: #94A3B8;
            --text-muted: #64748B;
            --accent-emerald: #0D9488;
            --accent-emerald-light: #14B8A6;
            --accent-gold: #D97706;
            --glow-color: rgba(13, 148, 136, 0.25);
            --shadow-card: 0 25px 60px -15px rgba(0, 0, 0, 0.9);
            --pill-bg: rgba(13, 148, 136, 0.12);
        }

        [data-theme="light"] {
            --bg-body: #FFFFFF;
            --bg-card: #FFFFFF;
            --bg-item: #F8FAFC;
            --border-card: #E2E8F0;
            --border-hover: #0D9488;
            --text-title: #0F172A;
            --text-body: #475569;
            --text-muted: #94A3B8;
            --accent-emerald: #0D9488;
            --accent-emerald-light: #0F766E;
            --accent-gold: #D97706;
            --glow-color: rgba(13, 148, 136, 0.1);
            --shadow-card: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
            --pill-bg: #F1F5F9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s, color 0.3s; }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-title);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow */
        .ambient-glow {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        .orb-1 {
            position: absolute;
            top: -15%; left: -10%; width: 65vw; height: 65vw;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 65%);
            border-radius: 50%;
            filter: blur(80px);
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-2 {
            position: absolute;
            bottom: -20%; right: -10%; width: 70vw; height: 70vw;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.1) 0%, transparent 65%);
            border-radius: 50%;
            filter: blur(90px);
            animation: float2 24s infinite alternate ease-in-out;
        }
        @keyframes float { 100% { transform: translate(10vw, 12vh); } }
        @keyframes float2 { 100% { transform: translate(-10vw, -12vh); } }

        /* Floating Theme Switcher */
        .theme-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            box-shadow: var(--shadow-card);
            transition: transform 0.3s, border-color 0.3s;
        }
        .theme-switcher:hover {
            transform: scale(1.1) rotate(15deg);
            border-color: var(--accent-emerald);
        }

        /* Container */
        .hub-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 540px;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        /* Hero Card */
        .hero-card {
            background: var(--bg-card);
            border: 1px solid var(--border-card);
            border-radius: 32px;
            padding: 38px 28px;
            text-align: center;
            backdrop-filter: blur(25px);
            box-shadow: var(--shadow-card);
            position: relative;
            overflow: hidden;
        }
        .hero-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(90deg, #0D9488, #D97706, #14B8A6);
        }

        .avatar-box {
            width: 95px;
            height: 95px;
            margin: 0 auto 18px auto;
            border-radius: 28px;
            background: conic-gradient(from 0deg, #0D9488, #D97706, #14B8A6);
            padding: 3px;
            box-shadow: 0 10px 25px -5px var(--glow-color);
        }
        .avatar-box-inner {
            width: 100%;
            height: 100%;
            background: var(--bg-card);
            border-radius: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }

        .greet-tag {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            font-weight: 800;
            color: var(--accent-emerald);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 6px;
        }
        .brand-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 26px;
            font-weight: 900;
            color: var(--text-title);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }
        .brand-subtitle {
            font-size: 13px;
            color: var(--text-body);
            line-height: 1.5;
        }

        /* Section Groups */
        .group-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .group-header {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding-left: 6px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .group-header::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-card);
        }

        /* Interactive Items */
        .hub-item {
            display: flex;
            align-items: center;
            background: var(--bg-item);
            border: 1px solid var(--border-card);
            padding: 16px 20px;
            border-radius: 20px;
            color: var(--text-title);
            text-decoration: none;
            font-weight: 700;
            font-size: 14px;
            backdrop-filter: blur(15px);
            box-shadow: 0 4px 15px -3px rgba(0,0,0,0.03);
            position: relative;
            overflow: hidden;
        }
        .hub-item:hover {
            transform: translateY(-3px) scale(1.015);
            border-color: var(--accent-emerald);
            background: var(--bg-card);
            box-shadow: 0 15px 30px -10px var(--glow-color);
        }
        .hub-item.featured {
            border-color: rgba(13, 148, 136, 0.5);
            background: var(--pill-bg);
        }
        .item-icon {
            font-size: 22px;
            margin-right: 15px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }
        .item-badge {
            margin-left: auto;
            font-size: 10px;
            background: linear-gradient(135deg, #0D9488, #D97706);
            color: #FFFFFF;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
        }
        .footer a {
            color: var(--accent-emerald);
            text-decoration: none;
            font-weight: 600;
        }

        @media (min-width: 900px) {
            .hub-wrapper {
                max-width: 1080px;
                flex-direction: row;
                align-items: flex-start;
                padding: 50px 30px;
                gap: 40px;
            }
            .hero-card {
                flex: 0 0 380px;
                position: sticky;
                top: 40px;
                text-align: left;
                padding: 45px 35px;
            }
            .avatar-box { margin: 0 0 20px 0; width: 105px; height: 105px; }
            .brand-title { font-size: 30px; }
            .main-content {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 30px;
            }
        }
    </style>
</head>
<body>

    <button id="themeToggleBtn" class="theme-switcher" onclick="toggleTheme()" title="Ganti Tema">🌙</button>

    <div class="ambient-glow">
        <div class="orb-1"></div>
        <div class="orb-2"></div>
    </div>

    <div class="hub-wrapper">
        <div class="hero-card">
            <div class="avatar-box">
                <div class="avatar-box-inner">🤖</div>
            </div>
            <div class="greet-tag" id="greetText">Selamat Datang</div>
            <h1 class="brand-title">RTMBOT Hub</h1>
            <p class="brand-subtitle">Platform Digital Islami, Otomasi &amp; Pusat Layanan Multi-Tools Terintegrasi.</p>
        </div>

        <div class="main-content" id="linksContainer"></div>
    </div>

    <div class="footer">&copy; 2026 <a href="https://rtmbot.biz.id">rtmbot.biz.id</a> • Solusi Digital Berkelanjutan</div>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('rtm_theme', next);
            updateThemeIcon();
        }

        function updateThemeIcon() {
            const btn = document.getElementById('themeToggleBtn');
            if (btn) {
                const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';
                btn.innerHTML = isDark ? '🌙' : '☀️';
            }
        }

        const dataSections = {
            "📖 Aplikasi & Fitur Utama": [
                { icon: "📖", title: "Al-Qur'an Digital & Audio Murottal", url: "quran/", id: "quran", featured: true, badge: "Islamic" },
                { icon: "🤖", title: "Chat AI Assistant Qurani", url: "chat/", id: "chat", featured: true, badge: "AI Ready" },
                { icon: "🛠️", title: "Jasa Pembuatan Bot & Setup Discord", url: "costum/", id: "costum" },
                { icon: "💻", title: "Tools Studio: QR & Kompresor Foto", url: "studio/", id: "studio" },
                { icon: "🎭", title: "Portofolio Pengembang", url: "portofolio/", id: "profile" }
            ],
            "🌐 Komunitas & Media Sosial": [
                { icon: "💬", title: "Bergabung di Komunitas Discord", url: "https://discord.com/users/1000737066822410311", id: "dc" },
                { icon: "📸", title: "Instagram Resmi @rhnxxhkm", url: "https://www.instagram.com/rhnxxhkm", id: "ig" }
            ],
            "☕ Donasi & Apresiasi": [
                { icon: "💰", title: "Bagi-Bagi Dukungan", url: "https://bagibagi.co/Rh7155", id: "bagi" },
                { icon: "💳", title: "Saweria Apresiasi", url: "https://saweria.co/RH7155", id: "saweria" },
                { icon: "⚡", title: "Sociabuzz Creator", url: "https://sociabuzz.com/abogoboga7155/tribe", id: "sosiabuzz" }
            ]
        };

        const container = document.getElementById("linksContainer");
        Object.keys(dataSections).forEach(cat => {
            const sec = document.createElement("div");
            sec.className = "group-section";
            
            const head = document.createElement("div");
            head.className = "group-header";
            head.innerText = cat;
            sec.appendChild(head);

            dataSections[cat].forEach(item => {
                const a = document.createElement("a");
                a.className = `hub-item ${item.featured ? 'featured' : ''}`;
                a.href = item.url;
                
                let html = `<div class="item-icon">${item.icon}</div><div>${item.title}</div>`;
                if (item.badge) {
                    html += `<div class="item-badge">${item.badge}</div>`;
                }
                a.innerHTML = html;
                sec.appendChild(a);
            });

            container.appendChild(sec);
        });

        const hour = new Date().getHours();
        const greetEl = document.getElementById("greetText");
        if (hour >= 4 && hour < 11) greetEl.innerText = "Selamat Pagi";
        else if (hour >= 11 && hour < 15) greetEl.innerText = "Selamat Siang";
        else if (hour >= 15 && hour < 18) greetEl.innerText = "Selamat Sore";
        else greetEl.innerText = "Selamat Malam";

        updateThemeIcon();
    </script>
</body>
</html>
