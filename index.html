<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>

    <script>
        (function() {
            const savedTheme = localStorage.getItem('rtm_theme') || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('rtm_theme', next);
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const btn = document.getElementById('themeToggleBtn');
            if (btn) {
                const isDark = (document.documentElement.getAttribute('data-theme') || 'dark') === 'dark';
                btn.innerHTML = isDark ? '🌙' : '☀️';
            }
        }
        window.addEventListener('DOMContentLoaded', updateThemeIcon);
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="hegC6QGjlcZtAX7SPgJhRO4Cdht479-PehDHq2HpZp4" />
    <title>RTMBOT — Hub &amp; Ekosistem Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        // Auto-forward Supabase auth and recovery tokens to reset-password.html
        if (window.location.hash && (window.location.hash.includes('type=recovery') || window.location.hash.includes('access_token'))) {
            window.location.replace('/reset-password.html' + window.location.hash);
        } else if (window.location.search && (window.location.search.includes('type=recovery') || window.location.search.includes('token_hash') || window.location.search.includes('code='))) {
            window.location.replace('/reset-password.html' + window.location.search);
        }
        if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
            location.replace(`https:${location.href.substring(location.protocol.length)}`);
        }
    </script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            color: #F8FAFC;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .bg-fx {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .ambient-1 {
            position: absolute;
            top: -20%;
            left: -10%;
            width: 70vw;
            height: 70vw;
            background: radial-gradient(circle, rgba(13, 148, 136, 0.16) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(80px);
            animation: drift 20s infinite alternate ease-in-out;
        }
        .ambient-2 {
            position: absolute;
            bottom: -20%;
            right: -10%;
            width: 75vw;
            height: 75vw;
            background: radial-gradient(circle, rgba(217, 119, 6, 0.12) 0%, transparent 60%);
            border-radius: 50%;
            filter: blur(85px);
            animation: drift2 25s infinite alternate ease-in-out;
        }
        .cursor-glow {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(20, 184, 166, 0.15) 0%, transparent 60%);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            filter: blur(60px);
            display: none;
            transition: top 0.1s ease-out, left 0.1s ease-out;
            pointer-events: none;
        }
        
        @keyframes drift { 100% { transform: translate(15vw, 15vh); } }
        @keyframes drift2 { 100% { transform: translate(-15vw, -15vh); } }
        @keyframes pulse-border {
            0% { border-color: rgba(20, 184, 166, 0.4); box-shadow: 0 0 0 0 rgba(20, 184, 166, 0.4); }
            70% { border-color: rgba(20, 184, 166, 0.8); box-shadow: 0 0 0 10px rgba(20, 184, 166, 0); }
            100% { border-color: rgba(20, 184, 166, 0.4); box-shadow: 0 0 0 0 rgba(20, 184, 166, 0); }
        }

        .main-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
            padding: 40px 20px 30px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .profile-card {
            background: rgba(15, 23, 42, 0.65);
            border: 1px solid rgba(51, 65, 85, 0.6);
            border-radius: 32px;
            padding: 40px 28px;
            text-align: center;
            backdrop-filter: blur(25px);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .profile-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0D9488, #D97706, #3B82F6);
        }
        
        .avatar-ring {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            margin: 0 auto 20px;
            background: conic-gradient(from 0deg, #0D9488, #D97706, #14B8A6);
            padding: 3px;
            box-shadow: 0 10px 25px -5px rgba(13, 148, 136, 0.4);
        }
        .avatar-inner {
            width: 100%;
            height: 100%;
            background: #0B1120;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 42px;
        }
        .dynamic-greet {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 700;
            color: #14B8A6;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }
        .brand-name {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(to right, #FFFFFF, #CBD5E1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }
        .brand-role {
            font-size: 13px;
            color: #94A3B8;
            line-height: 1.5;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 25px;
            width: 100%;
        }
        
        .category-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .category-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 12px;
            font-weight: 800;
            color: #64748B;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            padding-left: 8px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .category-title::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(51, 65, 85, 0.5);
        }

        .link-item {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(51, 65, 85, 0.65);
            padding: 16px 20px;
            border-radius: 18px;
            color: #F8FAFC;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            backdrop-filter: blur(15px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .link-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }
        .link-item:hover {
            transform: translateY(-3px) scale(1.015);
            border-color: #0D9488;
            background: rgba(13, 148, 136, 0.12);
            box-shadow: 0 15px 30px -10px rgba(13, 148, 136, 0.35);
        }
        .link-item:hover::after {
            left: 200%;
        }
        
        .link-item.highlight {
            background: rgba(13, 148, 136, 0.08);
            border: 1px solid rgba(20, 184, 166, 0.5);
            animation: pulse-border 2.5s infinite;
        }
        .link-item.highlight:hover {
            background: rgba(13, 148, 136, 0.2);
            border-color: #14B8A6;
            animation: none;
            transform: translateY(-3px) scale(1.015);
            box-shadow: 0 15px 30px -10px rgba(20, 184, 166, 0.4);
        }
        .highlight-badge {
            position: absolute;
            right: 18px;
            font-size: 10px;
            background: linear-gradient(135deg, #0D9488, #D97706);
            color: #FFFFFF;
            padding: 4px 10px;
            border-radius: 12px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .icon-box {
            font-size: 22px;
            margin-right: 16px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
        }
        
        .footer-mark {
            text-align: center;
            font-size: 12px;
            color: #64748B;
            margin-bottom: 30px;
            font-weight: 500;
            z-index: 1;
        }
        .footer-mark a {
            color: #0D9488;
            text-decoration: none;
        }

        @media (min-width: 900px) {
            .cursor-glow { display: block; }
            .main-wrapper {
                max-width: 1080px;
                flex-direction: row;
                align-items: flex-start;
                padding: 40px;
                gap: 45px;
                margin-bottom: 20px;
                min-height: 80vh;
            }
            
            .profile-card {
                flex: 0 0 360px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                text-align: left;
                padding: 50px 36px;
                position: sticky;
                top: 40px;
            }
            .profile-card::before {
                width: 4px;
                height: 100%;
                background: linear-gradient(180deg, #0D9488, #D97706, #3B82F6);
            }
            .avatar-ring {
                margin: 0 0 25px 0;
                width: 115px;
                height: 115px;
            }
            .avatar-inner { font-size: 48px; }
            .dynamic-greet { font-size: 13px; }
            .brand-name { font-size: 32px; line-height: 1.2; margin-bottom: 10px; }
            .brand-role { font-size: 14px; }
            
            .links-container {
                flex: 1;
                overflow-y: auto;
                padding-right: 12px;
                padding-bottom: 30px;
                display: flex;
                flex-direction: column;
                gap: 28px;
            }
            .links-container::-webkit-scrollbar { width: 6px; }
            .links-container::-webkit-scrollbar-track { background: transparent; }
            .links-container::-webkit-scrollbar-thumb { background: rgba(51,65,85,0.5); border-radius: 10px; }
            .links-container::-webkit-scrollbar-thumb:hover { background: rgba(13,148,136,0.6); }

            .link-item { padding: 20px 24px; font-size: 15px; border-radius: 20px; }
            
            .footer-mark {
                position: absolute;
                bottom: 16px;
                width: 100%;
                text-align: center;
                left: 0;
                margin-bottom: 0;
                pointer-events: none;
            }
        }
    
        /* THEME VARIABLES FOR DARK AND LIGHT MODE */
        :root {
            --bg-primary: #020617;
            --bg-secondary: #0B1120;
            --card-bg: rgba(15, 23, 42, 0.7);
            --card-border: rgba(51, 65, 85, 0.6);
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --accent-emerald: #0D9488;
            --accent-emerald-light: #14B8A6;
            --accent-gold: #D97706;
            --shadow-color: rgba(0, 0, 0, 0.6);
        }
        [data-theme="light"] {
            --bg-primary: #F8FAFC;
            --bg-secondary: #FFFFFF;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: rgba(226, 232, 240, 0.9);
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94A3B8;
            --accent-emerald: #0D9488;
            --accent-emerald-light: #0F766E;
            --accent-gold: #D97706;
            --shadow-color: rgba(15, 23, 42, 0.08);
        }
        .theme-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(15px);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            box-shadow: 0 8px 20px var(--shadow-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text-primary);
        }
        .theme-toggle-btn:hover {
            transform: scale(1.1) rotate(15deg);
            border-color: var(--accent-emerald);
        }
        [data-theme="light"] body {
            background-color: var(--bg-primary) !important;
            color: var(--text-primary) !important;
        }
        [data-theme="light"] .card, 
        [data-theme="light"] .profile-card,
        [data-theme="light"] .link-item,
        [data-theme="light"] .header,
        [data-theme="light"] .navbar {
            background: var(--card-bg) !important;
            border-color: var(--card-border) !important;
            color: var(--text-primary) !important;
        }
        [data-theme="light"] .brand-name,
        [data-theme="light"] .title,
        [data-theme="light"] .section-title,
        [data-theme="light"] .hero-title {
            color: var(--text-primary) !important;
            background: none !important;
            -webkit-text-fill-color: var(--text-primary) !important;
        }

</style>
</head>
<body>
    <button id="themeToggleBtn" class="theme-toggle-btn" onclick="toggleTheme()" title="Ganti Tema">🌙</button>

    <div class="bg-fx">
        <div class="ambient-1"></div>
        <div class="ambient-2"></div>
        <div class="cursor-glow" id="cursorGlow"></div>
    </div>

    <div class="main-wrapper">
        <div class="profile-card">
            <div class="avatar-ring">
                <div class="avatar-inner">🤖</div>
            </div>
            <div class="dynamic-greet" id="greetText">Selamat Datang</div>
            <div class="brand-name">RTMBOT Hub</div>
            <div class="brand-role">Sistem Otomasi, Alat Digital &amp; Platform Islami</div>
        </div>

        <div class="links-container" id="linksGen"></div>
    </div>
    
    <div class="footer-mark">&copy; 2026 <a href="https://rtmbot.biz.id">rtmbot.biz.id</a> • Solusi Digital Terintegrasi</div>

    <script>
        const categorizedLinks = {
            "📖 Layanan Utama & Aplikasi": [
                { icon: "📖", title: "Al-Quran Digital & Audio Murottal", url: "quran/", id: "quran", highlight: true, badge: "Islamic" },
                { icon: "🤖", title: "Chat AI Assistant Qurani", url: "chat/", id: "chat", highlight: true, badge: "AI Ready" },
                { icon: "🛠️", title: "Jasa Pembuatan Bot & Setup Discord", url: "costum/", id: "costum" },
                { icon: "💻", title: "Tools Studio: QR & Kompresor Foto", url: "studio/", id: "studio" },
                { icon: "🎭", title: "Portofolio Pengembang", url: "portofolio/", id: "profile" }
            ],
            "🌐 Komunitas & Media Sosial": [
                { icon: "💬", title: "Bergabung di Komunitas Discord", url: "https://discord.com/users/1000737066822410311", id: "dc" },
                { icon: "📸", title: "Instagram Resmi @rhnxxhkm", url: "https://www.instagram.com/rhnxxhkm", id: "ig" }
            ],
            "☕ Donasi & Dukungan Infaq": [
                { icon: "💰", title: "Bagi-Bagi Dukungan", url: "https://bagibagi.co/Rh7155", id: "bagi" },
                { icon: "💳", title: "Saweria Apresiasi", url: "https://saweria.co/RH7155", id: "saweria" },
                { icon: "⚡", title: "Sociabuzz Creator", url: "https://sociabuzz.com/abogoboga7155/tribe", id: "sosiabuzz" }
            ]
        };

        const paramUrl = new URLSearchParams(window.location.search).get('s');

        if (paramUrl) {
            let allLinks = [];
            Object.values(categorizedLinks).forEach(arr => allLinks.push(...arr));
            
            const trg = allLinks.find(k => k.id === paramUrl.toLowerCase().trim());
            if (trg) {
                window.location.href = trg.url;
            } else {
                renderUI();
            }
        } else {
            renderUI();
        }

        function renderUI() {
            const container = document.getElementById("linksGen");
            
            Object.keys(categorizedLinks).forEach(categoryName => {
                const groupDiv = document.createElement("div");
                groupDiv.className = "category-group";
                
                const titleDiv = document.createElement("div");
                titleDiv.className = "category-title";
                titleDiv.innerText = categoryName;
                groupDiv.appendChild(titleDiv);

                categorizedLinks[categoryName].forEach(item => {
                    const a = document.createElement("a");
                    a.className = `link-item ${item.highlight ? 'highlight' : ''}`;
                    a.href = item.url;
                    
                    let innerContent = `<div class="icon-box">${item.icon}</div><div>${item.title}</div>`;
                    if (item.badge) {
                        innerContent += `<div class="highlight-badge">${item.badge}</div>`;
                    }
                    
                    a.innerHTML = innerContent;
                    groupDiv.appendChild(a);
                });

                container.appendChild(groupDiv);
            });

            const hour = new Date().getHours();
            const greetEl = document.getElementById("greetText");
            if (hour >= 4 && hour < 11) greetEl.innerText = "Selamat Pagi";
            else if (hour >= 11 && hour < 15) greetEl.innerText = "Selamat Siang";
            else if (hour >= 15 && hour < 18) greetEl.innerText = "Selamat Sore";
            else greetEl.innerText = "Selamat Malam";
        }

        if (window.matchMedia("(min-width: 900px)").matches) {
            const glow = document.getElementById('cursorGlow');
            document.addEventListener('mousemove', function(e) {
                glow.style.left = e.clientX + 'px';
                glow.style.top = e.clientY + 'px';
            });
        }
    </script>
</body>
</html>
